	<rect x="0" y="0" width="19.09" height="20" fill="#6b4226"/><rect x="19.09" y="0" width="31.82" height="20" fill="#3f6fb0"/><rect x="50.91" y="0" width="19.09" height="20" fill="#6b4226"/>
