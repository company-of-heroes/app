<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 20" width="70" height="20">
	<title>Slate, rose and white edged ribbon, level 2</title>
	<defs>
		<linearGradient id="r172-shade" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
			<stop offset="0.25" stop-color="#fff" stop-opacity="0"/>
			<stop offset="0.7" stop-color="#000" stop-opacity="0"/>
			<stop offset="1" stop-color="#000" stop-opacity="0.35"/>
		</linearGradient>
		<pattern id="r172-weave" width="1.2" height="1.2" patternUnits="userSpaceOnUse">
			<rect width="0.5" height="1.2" fill="#000" opacity="0.1"/>
		</pattern>
		<linearGradient id="r172-metal" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#f6c79a"/>
			<stop offset="1" stop-color="#b4733a"/>
		</linearGradient>
		<filter id="r172-shadow" x="-20%" y="-20%" width="140%" height="140%">
			<feDropShadow dx="0" dy="0.6" stdDeviation="0.5" flood-color="#000" flood-opacity="0.6"/>
		</filter>
	</defs>
	<rect x="0" y="0" width="5.7" height="20" fill="#4d545c"/><rect x="5.7" y="0" width="2.44" height="20" fill="#cf7792"/><rect x="8.14" y="0" width="2.44" height="20" fill="#f4f1e8"/><rect x="10.58" y="0" width="48.84" height="20" fill="#cf7792"/><rect x="59.42" y="0" width="2.44" height="20" fill="#f4f1e8"/><rect x="61.86" y="0" width="2.44" height="20" fill="#cf7792"/><rect x="64.3" y="0" width="5.7" height="20" fill="#4d545c"/>
	<rect width="70" height="20" fill="url(#r172-weave)"/>
	<rect width="70" height="20" fill="url(#r172-shade)"/>
	<rect x="0.25" y="0.25" width="69.5" height="19.5" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="0.5"/>
	<g filter="url(#r172-shadow)"><g transform="translate(30 10) rotate(45)" fill="url(#r172-metal)" stroke="#3f230b" stroke-width="0.35"><rect x="-2.6" y="-2.6" width="5.2" height="5.2" rx="0.4"/><rect x="-1.1" y="-1.1" width="2.2" height="2.2" fill="none"/></g><g transform="translate(40 10) rotate(45)" fill="url(#r172-metal)" stroke="#3f230b" stroke-width="0.35"><rect x="-2.6" y="-2.6" width="5.2" height="5.2" rx="0.4"/><rect x="-1.1" y="-1.1" width="2.2" height="2.2" fill="none"/></g></g>
</svg>
