<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 20" width="70" height="20">
	<title>White, brown and orange bands ribbon with gold rosette</title>
	<defs>
		<linearGradient id="r102-shade" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
			<stop offset="0.25" stop-color="#fff" stop-opacity="0"/>
			<stop offset="0.7" stop-color="#000" stop-opacity="0"/>
			<stop offset="1" stop-color="#000" stop-opacity="0.35"/>
		</linearGradient>
		<pattern id="r102-weave" width="1.2" height="1.2" patternUnits="userSpaceOnUse">
			<rect width="0.5" height="1.2" fill="#000" opacity="0.1"/>
		</pattern>
		<linearGradient id="r102-metal" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#fff1bf"/>
			<stop offset="1" stop-color="#d6a640"/>
		</linearGradient>
		<filter id="r102-shadow" x="-20%" y="-20%" width="140%" height="140%">
			<feDropShadow dx="0" dy="0.6" stdDeviation="0.5" flood-color="#000" flood-opacity="0.6"/>
		</filter>
	</defs>
	<rect x="0" y="0" width="3" height="20" fill="#e0b23a"/><rect x="67" y="0" width="3" height="20" fill="#e0b23a"/><rect x="3" y="0" width="0.8" height="20" fill="#f4f1e8"/><rect x="66.2" y="0" width="0.8" height="20" fill="#f4f1e8"/><rect x="3.8" y="0" width="0.4" height="20" fill="#000" fill-opacity="0.55"/><rect x="65.8" y="0" width="0.4" height="20" fill="#000" fill-opacity="0.55"/><rect x="4.2" y="0" width="8.21" height="20" fill="#f4f1e8"/><rect x="12.41" y="0" width="4.11" height="20" fill="#6b4226"/><rect x="16.52" y="0" width="4.11" height="20" fill="#c8642a"/><rect x="20.63" y="0" width="8.21" height="20" fill="#6b4226"/><rect x="28.84" y="0" width="12.32" height="20" fill="#3f6fb0"/><rect x="41.16" y="0" width="8.21" height="20" fill="#6b4226"/><rect x="49.37" y="0" width="4.11" height="20" fill="#c8642a"/><rect x="53.48" y="0" width="4.11" height="20" fill="#6b4226"/><rect x="57.59" y="0" width="8.21" height="20" fill="#f4f1e8"/>
	<rect width="70" height="20" fill="url(#r102-weave)"/>
