<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 20" width="70" height="20">
	<title>White, brown and orange bands ribbon with gold rosette</title>
	<defs>
		<linearGradient id="r102-shade" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
			<stop offset="0.25" stop-color="#fff" stop-opacity="0"/>
			<stop offset="0.7" stop-color="#000" stop-opacity="0"/>
			<stop offset="1" stop-color="#000" stop-opacity="0.35"/>
		</linearGradient>
		<pattern id="r102-weave" width="1.2" height="1.2" patternUnits="userSpaceOnUse">
			<rect width="0.5" height="1.2" fill="#000" opacity="0.1"/>
		</pattern>
		<linearGradient id="r102-metal" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#fff1bf"/>
			<stop offset="1" stop-color="#d6a640"/>
		</linearGradient>
		<filter id="r102-shadow" x="-20%" y="-20%" width="140%" height="140%">
			<feDropShadow dx="0" dy="0.6" stdDeviation="0.5" flood-color="#000" flood-opacity="0.6"/>
		</filter>
	</defs>
	<rect x="0" y="0" width="9.33" height="20" fill="#f4f1e8"/><rect x="9.33" y="0" width="4.67" height="20" fill="#6b4226"/><rect x="14" y="0" width="4.67" height="20" fill="#c8642a"/><rect x="18.67" y="0" width="9.33" height="20" fill="#6b4226"/><rect x="28" y="0" width="14" height="20" fill="#3f6fb0"/><rect x="42" y="0" width="9.33" height="20" fill="#6b4226"/><rect x="51.33" y="0" width="4.67" height="20" fill="#c8642a"/><rect x="56" y="0" width="4.67" height="20" fill="#6b4226"/><rect x="60.67" y="0" width="9.33" height="20" fill="#f4f1e8"/>
	<rect width="70" height="20" fill="url(#r102-weave)"/>
	<rect width="70" height="20" fill="url(#r102-shade)"/>
	<rect x="0.25" y="0.25" width="69.5" height="19.5" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="0.5"/>
	<g filter="url(#r102-shadow)"><g transform="translate(35 10)" fill="url(#r102-metal)" stroke="#4f3a0c" stroke-width="0.35"><ellipse cy="-2.6" rx="1.3" ry="2" transform="rotate(0)"/><ellipse cy="-2.6" rx="1.3" ry="2" transform="rotate(45)"/><ellipse cy="-2.6" rx="1.3" ry="2" transform="rotate(90)"/><ellipse cy="-2.6" rx="1.3" ry="2" transform="rotate(135)"/><ellipse cy="-2.6" rx="1.3" ry="2" transform="rotate(180)"/><ellipse cy="-2.6" rx="1.3" ry="2" transform="rotate(225)"/><ellipse cy="-2.6" rx="1.3" ry="2" transform="rotate(270)"/><ellipse cy="-2.6" rx="1.3" ry="2" transform="rotate(315)"/><circle r="1.6"/></g></g>
</svg>
