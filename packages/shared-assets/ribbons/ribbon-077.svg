<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 20" width="70" height="20">
	<title>Feldgrau, bordeaux and navy split ribbon with gold tank badge</title>
	<defs>
		<linearGradient id="r077-shade" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
			<stop offset="0.25" stop-color="#fff" stop-opacity="0"/>
			<stop offset="0.7" stop-color="#000" stop-opacity="0"/>
			<stop offset="1" stop-color="#000" stop-opacity="0.35"/>
		</linearGradient>
		<pattern id="r077-weave" width="1.2" height="1.2" patternUnits="userSpaceOnUse">
			<rect width="0.5" height="1.2" fill="#000" opacity="0.1"/>
		</pattern>
		<linearGradient id="r077-metal" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#fff1bf"/>
			<stop offset="1" stop-color="#d6a640"/>
		</linearGradient>
		<filter id="r077-shadow" x="-20%" y="-20%" width="140%" height="140%">
			<feDropShadow dx="0" dy="0.6" stdDeviation="0.5" flood-color="#000" flood-opacity="0.6"/>
		</filter>
	</defs>
	<rect x="0" y="0" width="33.56" height="20" fill="#5d6450"/><rect x="33.56" y="0" width="2.88" height="20" fill="#5e1d2a"/><rect x="36.44" y="0" width="33.56" height="20" fill="#24406b"/>
	<rect width="70" height="20" fill="url(#r077-weave)"/>
	<rect width="70" height="20" fill="url(#r077-shade)"/>
	<rect x="0.25" y="0.25" width="69.5" height="19.5" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="0.5"/>
	<g filter="url(#r077-shadow)"><g transform="translate(35 10)" fill="url(#r077-metal)" stroke="#4f3a0c" stroke-width="0.3"><rect x="-6" y="0.6" width="12" height="3.4" rx="1.7"/><rect x="-4.8" y="-1.6" width="9.6" height="2.4" rx="0.5"/><rect x="-2.6" y="-4" width="5" height="2.6" rx="0.9"/><rect x="2" y="-3.3" width="5.4" height="0.9" rx="0.3"/></g></g>
</svg>
