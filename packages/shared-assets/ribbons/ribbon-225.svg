	<rect x="0" y="0" width="5.12" height="20" fill="#c8642a"/><rect x="5.12" y="0" width="8.54" height="20" fill="#24406b"/><rect x="13.66" y="0" width="8.54" height="20" fill="#b8924a"/><rect x="22.2" y="0" width="8.54" height="20" fill="#24406b"/><rect x="30.73" y="0" width="8.54" height="20" fill="#b8924a"/><rect x="39.27" y="0" width="8.54" height="20" fill="#24406b"/><rect x="47.8" y="0" width="8.54" height="20" fill="#b8924a"/><rect x="56.34" y="0" width="8.54" height="20" fill="#24406b"/><rect x="64.88" y="0" width="5.12" height="20" fill="#c8642a"/>
	<rect width="70" height="20" fill="url(#r225-weave)"/>
	<rect width="70" height="20" fill="url(#r225-shade)"/>
	<rect x="0.25" y="0.25" width="69.5" height="19.5" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="0.5"/>
