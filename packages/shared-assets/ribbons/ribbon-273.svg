	</defs>
	<rect x="0" y="0" width="33.56" height="20" fill="#e0b23a"/><rect x="33.56" y="0" width="2.88" height="20" fill="#24406b"/><rect x="36.44" y="0" width="33.56" height="20" fill="#8f2232"/>
