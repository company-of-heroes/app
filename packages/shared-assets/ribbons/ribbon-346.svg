<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 20" width="70" height="20">
	<title>White, yellow and black bands ribbon, level 1</title>
	<defs>
		<linearGradient id="r346-shade" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
			<stop offset="0.25" stop-color="#fff" stop-opacity="0"/>
			<stop offset="0.7" stop-color="#000" stop-opacity="0"/>
			<stop offset="1" stop-color="#000" stop-opacity="0.35"/>
		</linearGradient>
		<pattern id="r346-weave" width="1.2" height="1.2" patternUnits="userSpaceOnUse">
			<rect width="0.5" height="1.2" fill="#000" opacity="0.1"/>
		</pattern>
		<linearGradient id="r346-metal" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#f6c79a"/>
			<stop offset="1" stop-color="#b4733a"/>
		</linearGradient>
		<filter id="r346-shadow" x="-20%" y="-20%" width="140%" height="140%">
			<feDropShadow dx="0" dy="0.6" stdDeviation="0.5" flood-color="#000" flood-opacity="0.6"/>
		</filter>
	</defs>
	<rect x="0" y="0" width="4.38" height="20" fill="#f4f1e8"/><rect x="4.38" y="0" width="13.13" height="20" fill="#d9b43a"/><rect x="17.5" y="0" width="13.13" height="20" fill="#f4f1e8"/><rect x="30.63" y="0" width="8.75" height="20" fill="#1c1c1c"/><rect x="39.38" y="0" width="13.13" height="20" fill="#f4f1e8"/><rect x="52.5" y="0" width="13.13" height="20" fill="#d9b43a"/><rect x="65.63" y="0" width="4.38" height="20" fill="#f4f1e8"/>
	<rect width="70" height="20" fill="url(#r346-weave)"/>
	<rect width="70" height="20" fill="url(#r346-shade)"/>
	<rect x="0.25" y="0.25" width="69.5" height="19.5" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="0.5"/>
	<g filter="url(#r346-shadow)"><g transform="translate(35 10) rotate(45)" fill="url(#r346-metal)" stroke="#3f230b" stroke-width="0.35"><rect x="-2.6" y="-2.6" width="5.2" height="5.2" rx="0.4"/><rect x="-1.1" y="-1.1" width="2.2" height="2.2" fill="none"/></g></g>
</svg>
