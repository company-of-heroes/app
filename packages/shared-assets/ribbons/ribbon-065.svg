<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 20" width="70" height="20">
	<title>Green, navy and gold theatre ribbon with bronze rosette</title>
	<defs>
		<linearGradient id="r065-shade" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
			<stop offset="0.25" stop-color="#fff" stop-opacity="0"/>
			<stop offset="0.7" stop-color="#000" stop-opacity="0"/>
			<stop offset="1" stop-color="#000" stop-opacity="0.35"/>
		</linearGradient>
		<pattern id="r065-weave" width="1.2" height="1.2" patternUnits="userSpaceOnUse">
			<rect width="0.5" height="1.2" fill="#000" opacity="0.1"/>
		</pattern>
		<linearGradient id="r065-metal" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#f6c79a"/>
			<stop offset="1" stop-color="#b4733a"/>
		</linearGradient>
		<filter id="r065-shadow" x="-20%" y="-20%" width="140%" height="140%">
			<feDropShadow dx="0" dy="0.6" stdDeviation="0.5" flood-color="#000" flood-opacity="0.6"/>
		</filter>
	</defs>
	<rect x="0" y="0" width="28.23" height="20" fill="#2f5a34"/><rect x="28.23" y="0" width="3.95" height="20" fill="#24406b"/><rect x="32.18" y="0" width="5.65" height="20" fill="#e0b23a"/><rect x="37.82" y="0" width="3.95" height="20" fill="#24406b"/><rect x="41.77" y="0" width="28.23" height="20" fill="#2f5a34"/>
	<rect width="70" height="20" fill="url(#r065-weave)"/>
	<rect width="70" height="20" fill="url(#r065-shade)"/>
	<rect x="0.25" y="0.25" width="69.5" height="19.5" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="0.5"/>
	<g filter="url(#r065-shadow)"><g transform="translate(35 10)" fill="url(#r065-metal)" stroke="#3f230b" stroke-width="0.35"><ellipse cy="-2.6" rx="1.3" ry="2" transform="rotate(0)"/><ellipse cy="-2.6" rx="1.3" ry="2" transform="rotate(45)"/><ellipse cy="-2.6" rx="1.3" ry="2" transform="rotate(90)"/><ellipse cy="-2.6" rx="1.3" ry="2" transform="rotate(135)"/><ellipse cy="-2.6" rx="1.3" ry="2" transform="rotate(180)"/><ellipse cy="-2.6" rx="1.3" ry="2" transform="rotate(225)"/><ellipse cy="-2.6" rx="1.3" ry="2" transform="rotate(270)"/><ellipse cy="-2.6" rx="1.3" ry="2" transform="rotate(315)"/><circle r="1.6"/></g></g>
</svg>
