	<rect x="0" y="0" width="10.77" height="20" fill="#e6dfcc"/><rect x="10.77" y="0" width="10.77" height="20" fill="#f4f1e8"/><rect x="21.54" y="0" width="5.38" height="20" fill="#6b4226"/><rect x="26.92" y="0" width="16.15" height="20" fill="#34452c"/><rect x="43.08" y="0" width="5.38" height="20" fill="#6b4226"/><rect x="48.46" y="0" width="10.77" height="20" fill="#f4f1e8"/><rect x="59.23" y="0" width="10.77" height="20" fill="#e6dfcc"/>
	<rect width="70" height="20" fill="url(#r147-weave)"/>
	<rect width="70" height="20" fill="url(#r147-shade)"/>
	<rect x="0.25" y="0.25" width="69.5" height="19.5" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="0.5"/>
	<g filter="url(#r147-shadow)"><g transform="translate(30 10) rotate(45)" fill="url(#r147-metal)" stroke="#3f230b" stroke-width="0.35"><rect x="-2.6" y="-2.6" width="5.2" height="5.2" rx="0.4"/><rect x="-1.1" y="-1.1" width="2.2" height="2.2" fill="none"/></g><g transform="translate(40 10) rotate(45)" fill="url(#r147-metal)" stroke="#3f230b" stroke-width="0.35"><rect x="-2.6" y="-2.6" width="5.2" height="5.2" rx="0.4"/><rect x="-1.1" y="-1.1" width="2.2" height="2.2" fill="none"/></g></g>
