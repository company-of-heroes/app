<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 20" width="70" height="20">
	<title>Green, crimson and gold theatre ribbon with silver rosette</title>
	<defs>
		<linearGradient id="r060-shade" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
			<stop offset="0.25" stop-color="#fff" stop-opacity="0"/>
			<stop offset="0.7" stop-color="#000" stop-opacity="0"/>
			<stop offset="1" stop-color="#000" stop-opacity="0.35"/>
		</linearGradient>
		<pattern id="r060-weave" width="1.2" height="1.2" patternUnits="userSpaceOnUse">
			<rect width="0.5" height="1.2" fill="#000" opacity="0.1"/>
		</pattern>
		<linearGradient id="r060-metal" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="1" stop-color="#bfc5cc"/>
