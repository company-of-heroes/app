		<filter id="r060-shadow" x="-20%" y="-20%" width="140%" height="140%">
			<feDropShadow dx="0" dy="0.6" stdDeviation="0.5" flood-color="#000" flood-opacity="0.6"/>
		</filter>
	</defs>
	<rect x="0" y="0" width="2.4" height="20" fill="#b8924a"/><rect x="67.6" y="0" width="2.4" height="20" fill="#b8924a"/><rect x="2.4" y="0" width="1.6" height="20" fill="#c23b3b"/><rect x="66" y="0" width="1.6" height="20" fill="#c23b3b"/><rect x="4" y="0" width="0.4" height="20" fill="#000" fill-opacity="0.55"/><rect x="65.6" y="0" width="0.4" height="20" fill="#000" fill-opacity="0.55"/><rect x="4.4" y="0" width="24.68" height="20" fill="#2f5a34"/><rect x="29.08" y="0" width="3.45" height="20" fill="#8f2232"/><rect x="32.53" y="0" width="4.94" height="20" fill="#e0b23a"/><rect x="37.47" y="0" width="3.45" height="20" fill="#8f2232"/><rect x="40.92" y="0" width="24.68" height="20" fill="#2f5a34"/>
