	</defs>
	<rect x="0" y="0" width="20" height="20" fill="#c23b3b"/><rect x="20" y="0" width="10" height="20" fill="#2f5a34"/><rect x="30" y="0" width="10" height="20" fill="#c23b3b"/><rect x="40" y="0" width="10" height="20" fill="#2f5a34"/><rect x="50" y="0" width="20" height="20" fill="#c23b3b"/>
	<rect width="70" height="20" fill="url(#r325-weave)"/>
