<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 20" width="70" height="20">
	<title>Green and khaki edged ribbon</title>
	<defs>
		<linearGradient id="r252-shade" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
			<stop offset="0.25" stop-color="#fff" stop-opacity="0"/>
			<stop offset="0.7" stop-color="#000" stop-opacity="0"/>
			<stop offset="1" stop-color="#000" stop-opacity="0.35"/>
		</linearGradient>
		<pattern id="r252-weave" width="1.2" height="1.2" patternUnits="userSpaceOnUse">
			<rect width="0.5" height="1.2" fill="#000" opacity="0.1"/>
		</pattern>
	</defs>
	<rect x="0" y="0" width="6.13" height="20" fill="#2f5a34"/><rect x="6.13" y="0" width="57.75" height="20" fill="#b8924a"/><rect x="63.88" y="0" width="6.13" height="20" fill="#2f5a34"/>
	<rect width="70" height="20" fill="url(#r252-weave)"/>
	<rect width="70" height="20" fill="url(#r252-shade)"/>
	<rect x="0.25" y="0.25" width="69.5" height="19.5" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="0.5"/>
	
</svg>
