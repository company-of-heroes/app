<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 116" width="64" height="116">
	<title>Gold green enamel octagon with torch</title>
	<defs>
		<radialGradient id="m009-metal" cx="35%" cy="28%" r="80%">
			<stop offset="0" stop-color="#fff1bf"/>
			<stop offset="0.5" stop-color="#d6a640"/>
			<stop offset="1" stop-color="#86601a"/>
		</radialGradient>
		<linearGradient id="m009-rim" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#fff1bf"/>
			<stop offset="1" stop-color="#86601a"/>
		</linearGradient>
		<linearGradient id="m009-gloss" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
