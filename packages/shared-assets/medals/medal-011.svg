			<g transform="scale(1.15)" fill="#3f230b" color="#3f230b"><path d="M-9,-3 L0,-9 L9,-3 L9,0 L0,-6 L-9,0 Z"/><path d="M-9,2 L0,-4 L9,2 L9,5 L0,-1 L-9,5 Z"/><path d="M-9,7 L0,1 L9,7 L9,10 L0,4 L-9,10 Z"/></g>
