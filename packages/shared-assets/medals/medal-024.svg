<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 116" width="64" height="116">
	<title>Silver blue enamel hexagon with torch</title>
	<defs>
		<radialGradient id="m024-metal" cx="35%" cy="28%" r="80%">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="0.5" stop-color="#bfc5cc"/>
			<stop offset="1" stop-color="#6b737c"/>
		</radialGradient>
		<linearGradient id="m024-rim" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="1" stop-color="#6b737c"/>
		</linearGradient>
		<linearGradient id="m024-gloss" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
			<stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="m024-fold" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#000" stop-opacity="0.35"/>
			<stop offset="0.2" stop-color="#000" stop-opacity="0"/>
			<stop offset="0.8" stop-color="#000" stop-opacity="0"/>
			<stop offset="1" stop-color="#000" stop-opacity="0.35"/>
		</linearGradient>
		<pattern id="m024-weave" width="1.6" height="1.6" patternUnits="userSpaceOnUse">
			<rect width="0.6" height="1.6" fill="#000" opacity="0.12"/>
		</pattern>
		<clipPath id="m024-ribbon"><polygon points="12,0 52,0 52,46 32,38 12,46"/></clipPath>
		<filter id="m024-shadow" x="-30%" y="-30%" width="160%" height="160%">
			<feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity="0.55"/>
		</filter>
	</defs>
	<g>
		<g clip-path="url(#m024-ribbon)">
			<rect x="12" y="0" width="3.64" height="48" fill="#8f2232"/><rect x="15.64" y="0" width="7.27" height="48" fill="#c8642a"/><rect x="22.91" y="0" width="3.64" height="48" fill="#b8924a"/><rect x="26.55" y="0" width="10.91" height="48" fill="#24406b"/><rect x="37.45" y="0" width="3.64" height="48" fill="#b8924a"/><rect x="41.09" y="0" width="7.27" height="48" fill="#c8642a"/><rect x="48.36" y="0" width="3.64" height="48" fill="#8f2232"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m024-weave)"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m024-fold)"/>
		</g>
		<circle cx="32" cy="46" r="4" fill="none" stroke="url(#m024-rim)" stroke-width="2"/>
		<g transform="translate(32 84)" filter="url(#m024-shadow)">
			<path d="M0,-26 L22.52,-13 L22.52,13 L0,26 L-22.52,13 L-22.52,-13 Z" fill="url(#m024-metal)" stroke="#3d434a" stroke-width="1"/><path d="M0,-26 L22.52,-13 L22.52,13 L0,26 L-22.52,13 L-22.52,-13 Z" transform="scale(0.72)" fill="#1f4f9a" stroke="#6b737c" stroke-width="1"/><path d="M0,-26 L22.52,-13 L22.52,13 L0,26 L-22.52,13 L-22.52,-13 Z" transform="scale(0.72)" fill="url(#m024-gloss)"/>
			<g transform="scale(1.15)" fill="#ffffff" color="#ffffff"><path d="M0,-12 Q4,-8 2.5,-5 Q4,-6 3.5,-3 L-3.5,-3 Q-4,-7 -1,-8 Q-2,-10 0,-12 Z"/><path d="M-3.5,-2 L3.5,-2 L1.5,11 L-1.5,11 Z"/></g>
		</g>
