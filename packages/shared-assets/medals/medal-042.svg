<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 116" width="64" height="116">
	<title>Silver oval medal with crosshair</title>
	<defs>
		<radialGradient id="m042-metal" cx="35%" cy="28%" r="80%">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="0.5" stop-color="#bfc5cc"/>
			<stop offset="1" stop-color="#6b737c"/>
		</radialGradient>
		<linearGradient id="m042-rim" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="1" stop-color="#6b737c"/>
		</linearGradient>
		<linearGradient id="m042-gloss" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
			<stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="m042-fold" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#000" stop-opacity="0.35"/>
			<stop offset="0.2" stop-color="#000" stop-opacity="0"/>
			<stop offset="0.8" stop-color="#000" stop-opacity="0"/>
			<stop offset="1" stop-color="#000" stop-opacity="0.35"/>
		</linearGradient>
		<pattern id="m042-weave" width="1.6" height="1.6" patternUnits="userSpaceOnUse">
			<rect width="0.6" height="1.6" fill="#000" opacity="0.12"/>
		</pattern>
		<clipPath id="m042-ribbon"><polygon points="12,0 52,0 42,46 22,46"/></clipPath>
		<filter id="m042-shadow" x="-30%" y="-30%" width="160%" height="160%">
			<feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity="0.55"/>
		</filter>
	</defs>
	<g>
		<g clip-path="url(#m042-ribbon)">
			<rect x="12" y="0" width="14.55" height="48" fill="#c23b3b"/><rect x="26.55" y="0" width="10.91" height="48" fill="#24406b"/><rect x="37.45" y="0" width="14.55" height="48" fill="#c23b3b"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m042-weave)"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m042-fold)"/>
		</g>
		<circle cx="32" cy="47" r="3.4" fill="url(#m042-metal)" stroke="#3d434a" stroke-width="0.6"/><circle cx="32" cy="53" r="2.6" fill="none" stroke="url(#m042-rim)" stroke-width="1.6"/>
		<g transform="translate(32 84)" filter="url(#m042-shadow)">
			<path d="M-20,0 A20,26 0 1 0 20,0 A20,26 0 1 0 -20,0 Z" fill="url(#m042-metal)" stroke="#3d434a" stroke-width="1"/><path d="M-20,0 A20,26 0 1 0 20,0 A20,26 0 1 0 -20,0 Z" transform="scale(0.82)" fill="none" stroke="#6b737c" stroke-width="0.9" opacity="0.8"/>
			<g transform="scale(1.15)" fill="#3d434a" color="#3d434a"><circle r="7.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle r="1.6"/><rect x="-0.7" y="-11" width="1.4" height="6"/><rect x="-0.7" y="5" width="1.4" height="6"/><rect x="-11" y="-0.7" width="6" height="1.4"/><rect x="5" y="-0.7" width="6" height="1.4"/></g>
		</g>
