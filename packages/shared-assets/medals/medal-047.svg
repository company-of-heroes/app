<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 116" width="64" height="116">
	<title>Gold green enamel oval medal with numeral</title>
	<defs>
		<radialGradient id="m047-metal" cx="35%" cy="28%" r="80%">
			<stop offset="0" stop-color="#fff1bf"/>
			<stop offset="0.5" stop-color="#d6a640"/>
			<stop offset="1" stop-color="#86601a"/>
		</radialGradient>
		<linearGradient id="m047-rim" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#fff1bf"/>
			<stop offset="1" stop-color="#86601a"/>
		</linearGradient>
		<linearGradient id="m047-gloss" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
			<stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="m047-fold" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#000" stop-opacity="0.35"/>
			<stop offset="0.2" stop-color="#000" stop-opacity="0"/>
			<stop offset="0.8" stop-color="#000" stop-opacity="0"/>
			<stop offset="1" stop-color="#000" stop-opacity="0.35"/>
		</linearGradient>
		<pattern id="m047-weave" width="1.6" height="1.6" patternUnits="userSpaceOnUse">
			<rect width="0.6" height="1.6" fill="#000" opacity="0.12"/>
		</pattern>
		<clipPath id="m047-ribbon"><polygon points="12,0 52,0 52,44 12,44"/></clipPath>
		<filter id="m047-shadow" x="-30%" y="-30%" width="160%" height="160%">
			<feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity="0.55"/>
		</filter>
	</defs>
	<g>
		<g clip-path="url(#m047-ribbon)">
			<rect x="12" y="0" width="10.67" height="48" fill="#e6dfcc"/><rect x="22.67" y="0" width="5.33" height="48" fill="#c8642a"/><rect x="28" y="0" width="8" height="48" fill="#2f5a34"/><rect x="36" y="0" width="5.33" height="48" fill="#c8642a"/><rect x="41.33" y="0" width="10.67" height="48" fill="#e6dfcc"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m047-weave)"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m047-fold)"/>
		</g>
		<circle cx="32" cy="48" r="4" fill="none" stroke="url(#m047-rim)" stroke-width="2"/>
		<g transform="translate(32 84)" filter="url(#m047-shadow)">
			<path d="M-20,0 A20,26 0 1 0 20,0 A20,26 0 1 0 -20,0 Z" fill="url(#m047-metal)" stroke="#4f3a0c" stroke-width="1"/><path d="M-20,0 A20,26 0 1 0 20,0 A20,26 0 1 0 -20,0 Z" transform="scale(0.72)" fill="#2f6b3a" stroke="#86601a" stroke-width="1"/><path d="M-20,0 A20,26 0 1 0 20,0 A20,26 0 1 0 -20,0 Z" transform="scale(0.72)" fill="url(#m047-gloss)"/>
			<g transform="scale(1.15)" fill="#fff1bf" color="#fff1bf"><text y="5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="14">V</text></g>
		</g>
	</g>
