			<g transform="scale(1.15)" fill="#f6c79a" color="#f6c79a"><path d="M0,-9.5 L2.23,-3.07 L9.04,-2.94 L3.61,1.17 L5.58,7.69 L0,3.8 L-5.58,7.69 L-3.61,1.17 L-9.04,-2.94 L-2.23,-3.07 Z"/></g>
