<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 116" width="64" height="116">
	<title>Bronze navy enamel oval medal with torch</title>
	<defs>
		<radialGradient id="m057-metal" cx="35%" cy="28%" r="80%">
			<stop offset="0" stop-color="#f6c79a"/>
			<stop offset="0.5" stop-color="#b4733a"/>
			<stop offset="1" stop-color="#6b3d18"/>
		</radialGradient>
		<linearGradient id="m057-rim" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#f6c79a"/>
			<stop offset="1" stop-color="#6b3d18"/>
		</linearGradient>
		<linearGradient id="m057-gloss" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
			<stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="m057-fold" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#000" stop-opacity="0.35"/>
			<stop offset="0.2" stop-color="#000" stop-opacity="0"/>
			<stop offset="0.8" stop-color="#000" stop-opacity="0"/>
			<stop offset="1" stop-color="#000" stop-opacity="0.35"/>
		</linearGradient>
		<pattern id="m057-weave" width="1.6" height="1.6" patternUnits="userSpaceOnUse">
			<rect width="0.6" height="1.6" fill="#000" opacity="0.12"/>
		</pattern>
		<clipPath id="m057-ribbon"><polygon points="12,0 52,0 42,46 22,46"/></clipPath>
		<filter id="m057-shadow" x="-30%" y="-30%" width="160%" height="160%">
			<feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity="0.55"/>
		</filter>
	</defs>
	<g>
		<g clip-path="url(#m057-ribbon)">
			<rect x="12" y="0" width="6.4" height="48" fill="#6b2d5c"/><rect x="18.4" y="0" width="3.2" height="48" fill="#56622e"/><rect x="21.6" y="0" width="3.2" height="48" fill="#2f5a34"/><rect x="24.8" y="0" width="14.4" height="48" fill="#e0b23a"/><rect x="39.2" y="0" width="3.2" height="48" fill="#2f5a34"/><rect x="42.4" y="0" width="3.2" height="48" fill="#56622e"/><rect x="45.6" y="0" width="6.4" height="48" fill="#6b2d5c"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m057-weave)"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m057-fold)"/>
		</g>
		<circle cx="32" cy="50" r="4" fill="none" stroke="url(#m057-rim)" stroke-width="2"/>
		<g transform="translate(32 84)" filter="url(#m057-shadow)">
			<path d="M-20,0 A20,26 0 1 0 20,0 A20,26 0 1 0 -20,0 Z" fill="url(#m057-metal)" stroke="#3f230b" stroke-width="1"/><path d="M-20,0 A20,26 0 1 0 20,0 A20,26 0 1 0 -20,0 Z" transform="scale(0.72)" fill="#1b2a4a" stroke="#6b3d18" stroke-width="1"/><path d="M-20,0 A20,26 0 1 0 20,0 A20,26 0 1 0 -20,0 Z" transform="scale(0.72)" fill="url(#m057-gloss)"/>
			<g transform="scale(1.15)" fill="#f6c79a" color="#f6c79a"><path d="M0,-12 Q4,-8 2.5,-5 Q4,-6 3.5,-3 L-3.5,-3 Q-4,-7 -1,-8 Q-2,-10 0,-12 Z"/><path d="M-3.5,-2 L3.5,-2 L1.5,11 L-1.5,11 Z"/></g>
		</g>
