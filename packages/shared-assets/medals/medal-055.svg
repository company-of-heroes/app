			<path d="M0,-29 L22,0 L0,29 L-22,0 Z" fill="url(#m055-metal)" stroke="#3d434a" stroke-width="1"/><path d="M0,-29 L22,0 L0,29 L-22,0 Z" transform="scale(0.8)" fill="#2f6b3a" stroke="#6b737c" stroke-width="1"/><path d="M0,-29 L22,0 L0,29 L-22,0 Z" transform="scale(0.8)" fill="url(#m055-gloss)"/><circle r="11" fill="url(#m055-metal)" stroke="#3d434a" stroke-width="0.8"/><circle r="9.2" fill="none" stroke="#6b737c" stroke-width="0.6"/>
			<g transform="scale(0.78)" fill="#3d434a" color="#3d434a"><rect x="-11" y="2" width="22" height="6" rx="3"/><rect x="-9" y="-2.5" width="18" height="4" rx="1"/><rect x="-5" y="-7" width="9" height="4.5" rx="1.5"/><rect x="3" y="-5.6" width="10" height="1.6" rx="0.5"/></g>
		</g>
