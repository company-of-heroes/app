<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 116" width="64" height="116">
	<title>Silver green enamel diamond with tank</title>
	<defs>
		<radialGradient id="m055-metal" cx="35%" cy="28%" r="80%">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="0.5" stop-color="#bfc5cc"/>
			<stop offset="1" stop-color="#6b737c"/>
		</radialGradient>
		<linearGradient id="m055-rim" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="1" stop-color="#6b737c"/>
		</linearGradient>
		<linearGradient id="m055-gloss" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
			<stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="m055-fold" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#000" stop-opacity="0.35"/>
			<stop offset="0.2" stop-color="#000" stop-opacity="0"/>
			<stop offset="0.8" stop-color="#000" stop-opacity="0"/>
			<stop offset="1" stop-color="#000" stop-opacity="0.35"/>
		</linearGradient>
		<pattern id="m055-weave" width="1.6" height="1.6" patternUnits="userSpaceOnUse">
			<rect width="0.6" height="1.6" fill="#000" opacity="0.12"/>
		</pattern>
		<clipPath id="m055-ribbon"><polygon points="12,0 52,0 42,46 22,46"/></clipPath>
		<filter id="m055-shadow" x="-30%" y="-30%" width="160%" height="160%">
			<feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity="0.55"/>
		</filter>
	</defs>
	<g>
		<g clip-path="url(#m055-ribbon)">
			<rect x="12" y="0" width="2.96" height="48" fill="#6b2d5c"/><rect x="14.96" y="0" width="2.96" height="48" fill="#b8924a"/><rect x="17.93" y="0" width="5.93" height="48" fill="#56622e"/><rect x="23.85" y="0" width="5.93" height="48" fill="#8f2232"/><rect x="29.78" y="0" width="4.44" height="48" fill="#6b2d5c"/><rect x="34.22" y="0" width="5.93" height="48" fill="#8f2232"/><rect x="40.15" y="0" width="5.93" height="48" fill="#56622e"/><rect x="46.07" y="0" width="2.96" height="48" fill="#b8924a"/><rect x="49.04" y="0" width="2.96" height="48" fill="#6b2d5c"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m055-weave)"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m055-fold)"/>
