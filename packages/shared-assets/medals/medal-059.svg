			<rect x="12" y="0" width="6" height="48" fill="#6b2d5c"/><rect x="18" y="0" width="8" height="48" fill="#c8642a"/><rect x="26" y="0" width="12" height="48" fill="#3f6fb0"/><rect x="38" y="0" width="8" height="48" fill="#c8642a"/><rect x="46" y="0" width="6" height="48" fill="#6b2d5c"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m059-weave)"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m059-fold)"/>
