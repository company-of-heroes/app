			<g transform="scale(0.78)" fill="#3f230b" color="#3f230b"><path d="M-10,3 Q-10,-9 0,-9 Q10,-9 10,3 L13,4.5 L13,6 L-13,6 L-13,4.5 Z"/><rect x="-7" y="7.5" width="14" height="1.2" rx="0.6"/></g>
