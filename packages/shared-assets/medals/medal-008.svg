<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 116" width="64" height="116">
	<title>Bronze shield with numeral</title>
	<defs>
		<radialGradient id="m008-metal" cx="35%" cy="28%" r="80%">
			<stop offset="0" stop-color="#f6c79a"/>
			<stop offset="0.5" stop-color="#b4733a"/>
			<stop offset="1" stop-color="#6b3d18"/>
		</radialGradient>
		<linearGradient id="m008-rim" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#f6c79a"/>
			<stop offset="1" stop-color="#6b3d18"/>
		</linearGradient>
		<linearGradient id="m008-gloss" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
			<stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="m008-fold" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#000" stop-opacity="0.35"/>
			<stop offset="0.2" stop-color="#000" stop-opacity="0"/>
			<stop offset="0.8" stop-color="#000" stop-opacity="0"/>
			<stop offset="1" stop-color="#000" stop-opacity="0.35"/>
		</linearGradient>
		<pattern id="m008-weave" width="1.6" height="1.6" patternUnits="userSpaceOnUse">
			<rect width="0.6" height="1.6" fill="#000" opacity="0.12"/>
		</pattern>
		<clipPath id="m008-ribbon"><polygon points="12,0 52,0 52,44 12,44"/></clipPath>
		<filter id="m008-shadow" x="-30%" y="-30%" width="160%" height="160%">
			<feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity="0.55"/>
		</filter>
	</defs>
	<g>
		<g clip-path="url(#m008-ribbon)">
			<rect x="12" y="0" width="9.23" height="48" fill="#2f5a34"/><rect x="21.23" y="0" width="6.15" height="48" fill="#1c1c1c"/><rect x="27.38" y="0" width="9.23" height="48" fill="#6b2d5c"/><rect x="36.62" y="0" width="6.15" height="48" fill="#1c1c1c"/><rect x="42.77" y="0" width="9.23" height="48" fill="#2f5a34"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m008-weave)"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m008-fold)"/>
		</g>
		<circle cx="32" cy="45" r="3.4" fill="url(#m008-metal)" stroke="#3f230b" stroke-width="0.6"/><circle cx="32" cy="51" r="2.6" fill="none" stroke="url(#m008-rim)" stroke-width="1.6"/>
		<g transform="translate(32 84)" filter="url(#m008-shadow)">
			<path d="M-21,-24 H21 V0 Q21,17 0,28 Q-21,17 -21,0 Z" fill="url(#m008-metal)" stroke="#3f230b" stroke-width="1"/><path d="M-21,-24 H21 V0 Q21,17 0,28 Q-21,17 -21,0 Z" transform="scale(0.82)" fill="none" stroke="#6b3d18" stroke-width="0.9" opacity="0.8"/>
			<g transform="scale(1.15)" fill="#3f230b" color="#3f230b"><text y="5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="14">V</text></g>
		</g>
	</g>
