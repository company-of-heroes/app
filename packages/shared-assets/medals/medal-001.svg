<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 116" width="64" height="116">
	<title>Gold diamond with swords</title>
	<defs>
		<radialGradient id="m001-metal" cx="35%" cy="28%" r="80%">
			<stop offset="0" stop-color="#fff1bf"/>
			<stop offset="0.5" stop-color="#d6a640"/>
			<stop offset="1" stop-color="#86601a"/>
		</radialGradient>
		<linearGradient id="m001-rim" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#fff1bf"/>
			<stop offset="1" stop-color="#86601a"/>
		</linearGradient>
		<linearGradient id="m001-gloss" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
			<stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="m001-fold" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#000" stop-opacity="0.35"/>
			<stop offset="0.2" stop-color="#000" stop-opacity="0"/>
			<stop offset="0.8" stop-color="#000" stop-opacity="0"/>
			<stop offset="1" stop-color="#000" stop-opacity="0.35"/>
		</linearGradient>
		<pattern id="m001-weave" width="1.6" height="1.6" patternUnits="userSpaceOnUse">
			<rect width="0.6" height="1.6" fill="#000" opacity="0.12"/>
		</pattern>
		<clipPath id="m001-ribbon"><polygon points="12,0 52,0 42,46 22,46"/></clipPath>
		<filter id="m001-shadow" x="-30%" y="-30%" width="160%" height="160%">
			<feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity="0.55"/>
		</filter>
	</defs>
	<g>
		<g clip-path="url(#m001-ribbon)">
			<rect x="12" y="0" width="5.33" height="48" fill="#c8642a"/><rect x="17.33" y="0" width="10.67" height="48" fill="#f4f1e8"/><rect x="28" y="0" width="8" height="48" fill="#24406b"/><rect x="36" y="0" width="10.67" height="48" fill="#f4f1e8"/><rect x="46.67" y="0" width="5.33" height="48" fill="#c8642a"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m001-weave)"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m001-fold)"/>
		</g>
		<circle cx="32" cy="50" r="4" fill="none" stroke="url(#m001-rim)" stroke-width="2"/>
		<g transform="translate(32 84)" filter="url(#m001-shadow)">
			<path d="M0,-29 L22,0 L0,29 L-22,0 Z" fill="url(#m001-metal)" stroke="#4f3a0c" stroke-width="1"/><path d="M0,-29 L22,0 L0,29 L-22,0 Z" transform="scale(0.82)" fill="none" stroke="#86601a" stroke-width="0.9" opacity="0.8"/><circle r="11" fill="url(#m001-metal)" stroke="#4f3a0c" stroke-width="0.8"/><circle r="9.2" fill="none" stroke="#86601a" stroke-width="0.6"/>
			<g transform="scale(0.78)" fill="#4f3a0c" color="#4f3a0c"><g transform="rotate(45)"><path d="M-1.1,-11 L0,-12.8 L1.1,-11 L1.1,5 L-1.1,5 Z"/><rect x="-4" y="5" width="8" height="1.6" rx="0.6"/><rect x="-0.8" y="6.6" width="1.6" height="4"/><circle cx="0" cy="11.4" r="1.2"/></g><g transform="rotate(-45)"><path d="M-1.1,-11 L0,-12.8 L1.1,-11 L1.1,5 L-1.1,5 Z"/><rect x="-4" y="5" width="8" height="1.6" rx="0.6"/><rect x="-0.8" y="6.6" width="1.6" height="4"/><circle cx="0" cy="11.4" r="1.2"/></g></g>
		</g>
	</g>
