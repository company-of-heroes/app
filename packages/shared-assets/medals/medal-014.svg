<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 116" width="64" height="116">
	<title>Gold red enamel hexagon with shell</title>
	<defs>
		<radialGradient id="m014-metal" cx="35%" cy="28%" r="80%">
			<stop offset="0" stop-color="#fff1bf"/>
			<stop offset="0.5" stop-color="#d6a640"/>
			<stop offset="1" stop-color="#86601a"/>
		</radialGradient>
		<linearGradient id="m014-rim" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#fff1bf"/>
			<stop offset="1" stop-color="#86601a"/>
		</linearGradient>
		<linearGradient id="m014-gloss" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
			<stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="m014-fold" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#000" stop-opacity="0.35"/>
			<stop offset="0.2" stop-color="#000" stop-opacity="0"/>
			<stop offset="0.8" stop-color="#000" stop-opacity="0"/>
			<stop offset="1" stop-color="#000" stop-opacity="0.35"/>
		</linearGradient>
		<pattern id="m014-weave" width="1.6" height="1.6" patternUnits="userSpaceOnUse">
			<rect width="0.6" height="1.6" fill="#000" opacity="0.12"/>
		</pattern>
		<clipPath id="m014-ribbon"><polygon points="12,0 52,0 42,46 22,46"/></clipPath>
		<filter id="m014-shadow" x="-30%" y="-30%" width="160%" height="160%">
			<feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity="0.55"/>
		</filter>
	</defs>
	<g>
		<g clip-path="url(#m014-ribbon)">
			<rect x="12" y="0" width="8.28" height="48" fill="#56622e"/><rect x="20.28" y="0" width="5.52" height="48" fill="#e6dfcc"/><rect x="25.79" y="0" width="12.41" height="48" fill="#3f6fb0"/><rect x="38.21" y="0" width="5.52" height="48" fill="#e6dfcc"/><rect x="43.72" y="0" width="8.28" height="48" fill="#56622e"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m014-weave)"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m014-fold)"/>
		</g>
		<circle cx="32" cy="50" r="4" fill="none" stroke="url(#m014-rim)" stroke-width="2"/>
		<g transform="translate(32 84)" filter="url(#m014-shadow)">
			<path d="M0,-26 L22.52,-13 L22.52,13 L0,26 L-22.52,13 L-22.52,-13 Z" fill="url(#m014-metal)" stroke="#4f3a0c" stroke-width="1"/><path d="M0,-26 L22.52,-13 L22.52,13 L0,26 L-22.52,13 L-22.52,-13 Z" transform="scale(0.72)" fill="#a3202f" stroke="#86601a" stroke-width="1"/><path d="M0,-26 L22.52,-13 L22.52,13 L0,26 L-22.52,13 L-22.52,-13 Z" transform="scale(0.72)" fill="url(#m014-gloss)"/>
			<g transform="scale(1.15)" fill="#fff1bf" color="#fff1bf"><path d="M-3.5,-4 Q-3.5,-11 0,-12 Q3.5,-11 3.5,-4 Z"/><rect x="-3.5" y="-3" width="7" height="10"/><rect x="-4.2" y="7.5" width="8.4" height="3" rx="0.6"/></g>
		</g>
	</g>
</svg>
