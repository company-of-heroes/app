<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 116" width="64" height="116">
	<title>Bronze green enamel hexagon with torch</title>
	<defs>
		<radialGradient id="m010-metal" cx="35%" cy="28%" r="80%">
			<stop offset="0" stop-color="#f6c79a"/>
			<stop offset="0.5" stop-color="#b4733a"/>
			<stop offset="1" stop-color="#6b3d18"/>
		</radialGradient>
		<linearGradient id="m010-rim" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#f6c79a"/>
			<stop offset="1" stop-color="#6b3d18"/>
		</linearGradient>
		<linearGradient id="m010-gloss" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
			<stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="m010-fold" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#000" stop-opacity="0.35"/>
			<stop offset="0.2" stop-color="#000" stop-opacity="0"/>
			<stop offset="0.8" stop-color="#000" stop-opacity="0"/>
			<stop offset="1" stop-color="#000" stop-opacity="0.35"/>
		</linearGradient>
		<pattern id="m010-weave" width="1.6" height="1.6" patternUnits="userSpaceOnUse">
			<rect width="0.6" height="1.6" fill="#000" opacity="0.12"/>
		</pattern>
		<clipPath id="m010-ribbon"><polygon points="12,0 52,0 52,40 32,47 12,40"/></clipPath>
		<filter id="m010-shadow" x="-30%" y="-30%" width="160%" height="160%">
			<feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity="0.55"/>
		</filter>
	</defs>
	<g>
		<g clip-path="url(#m010-ribbon)">
			<rect x="12" y="0" width="8.89" height="48" fill="#c23b3b"/><rect x="20.89" y="0" width="8.89" height="48" fill="#b8924a"/><rect x="29.78" y="0" width="4.44" height="48" fill="#c23b3b"/><rect x="34.22" y="0" width="8.89" height="48" fill="#b8924a"/><rect x="43.11" y="0" width="8.89" height="48" fill="#c23b3b"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m010-weave)"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m010-fold)"/>
		</g>
		<ellipse cx="32" cy="50" rx="6" ry="4.5" fill="none" stroke="url(#m010-rim)" stroke-width="2"/>
		<g transform="translate(32 84)" filter="url(#m010-shadow)">
			<path d="M0,-26 L22.52,-13 L22.52,13 L0,26 L-22.52,13 L-22.52,-13 Z" fill="url(#m010-metal)" stroke="#3f230b" stroke-width="1"/><path d="M0,-26 L22.52,-13 L22.52,13 L0,26 L-22.52,13 L-22.52,-13 Z" transform="scale(0.72)" fill="#2f6b3a" stroke="#6b3d18" stroke-width="1"/><path d="M0,-26 L22.52,-13 L22.52,13 L0,26 L-22.52,13 L-22.52,-13 Z" transform="scale(0.72)" fill="url(#m010-gloss)"/>
			<g transform="scale(1.15)" fill="#f6c79a" color="#f6c79a"><path d="M0,-12 Q4,-8 2.5,-5 Q4,-6 3.5,-3 L-3.5,-3 Q-4,-7 -1,-8 Q-2,-10 0,-12 Z"/><path d="M-3.5,-2 L3.5,-2 L1.5,11 L-1.5,11 Z"/></g>
		</g>
