			<g transform="scale(1.15)" fill="#f6c79a" color="#f6c79a"><path d="M-11,-1 Q-11,-11 0,-11 Q11,-11 11,-1 Q8,-3 5.5,-1 Q3,-3 0,-1 Q-3,-3 -5.5,-1 Q-8,-3 -11,-1 Z"/><path d="M-11,-1 L-1,8 M11,-1 L1,8 M-5.5,-1 L-0.5,8 M5.5,-1 L0.5,8" fill="none" stroke="currentColor" stroke-width="0.7"/><rect x="-1.6" y="7.5" width="3.2" height="3.5" rx="1"/></g>
