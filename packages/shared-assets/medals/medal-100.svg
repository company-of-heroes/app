<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 116" width="64" height="116">
	<title>Gold diamond with crosshair</title>
	<defs>
		<radialGradient id="m100-metal" cx="35%" cy="28%" r="80%">
			<stop offset="0" stop-color="#fff1bf"/>
			<stop offset="0.5" stop-color="#d6a640"/>
			<stop offset="1" stop-color="#86601a"/>
		</radialGradient>
		<linearGradient id="m100-rim" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#fff1bf"/>
			<stop offset="1" stop-color="#86601a"/>
		</linearGradient>
		<linearGradient id="m100-gloss" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
			<stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="m100-fold" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#000" stop-opacity="0.35"/>
			<stop offset="0.2" stop-color="#000" stop-opacity="0"/>
			<stop offset="0.8" stop-color="#000" stop-opacity="0"/>
			<stop offset="1" stop-color="#000" stop-opacity="0.35"/>
		</linearGradient>
		<pattern id="m100-weave" width="1.6" height="1.6" patternUnits="userSpaceOnUse">
			<rect width="0.6" height="1.6" fill="#000" opacity="0.12"/>
		</pattern>
		<clipPath id="m100-ribbon"><polygon points="12,0 52,0 52,40 32,47 12,40"/></clipPath>
		<filter id="m100-shadow" x="-30%" y="-30%" width="160%" height="160%">
			<feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity="0.55"/>
		</filter>
	</defs>
	<g>
		<g clip-path="url(#m100-ribbon)">
			<rect x="12" y="0" width="3.56" height="48" fill="#6b2d5c"/><rect x="15.56" y="0" width="7.11" height="48" fill="#3f6fb0"/><rect x="22.67" y="0" width="5.33" height="48" fill="#e6dfcc"/><rect x="28" y="0" width="8" height="48" fill="#24406b"/><rect x="36" y="0" width="5.33" height="48" fill="#e6dfcc"/><rect x="41.33" y="0" width="7.11" height="48" fill="#3f6fb0"/><rect x="48.44" y="0" width="3.56" height="48" fill="#6b2d5c"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m100-weave)"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m100-fold)"/>
		</g>
		<circle cx="32" cy="50" r="4" fill="none" stroke="url(#m100-rim)" stroke-width="2"/>
		<g transform="translate(32 84)" filter="url(#m100-shadow)">
			<path d="M0,-29 L22,0 L0,29 L-22,0 Z" fill="url(#m100-metal)" stroke="#4f3a0c" stroke-width="1"/><path d="M0,-29 L22,0 L0,29 L-22,0 Z" transform="scale(0.82)" fill="none" stroke="#86601a" stroke-width="0.9" opacity="0.8"/><circle r="11" fill="url(#m100-metal)" stroke="#4f3a0c" stroke-width="0.8"/><circle r="9.2" fill="none" stroke="#86601a" stroke-width="0.6"/>
			<g transform="scale(0.78)" fill="#4f3a0c" color="#4f3a0c"><circle r="7.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle r="1.6"/><rect x="-0.7" y="-11" width="1.4" height="6"/><rect x="-0.7" y="5" width="1.4" height="6"/><rect x="-11" y="-0.7" width="6" height="1.4"/><rect x="5" y="-0.7" width="6" height="1.4"/></g>
		</g>
	</g>
</svg>
