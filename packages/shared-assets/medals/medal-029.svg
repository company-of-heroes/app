<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 116" width="64" height="116">
	<title>Silver red enamel cross with numeral</title>
	<defs>
		<radialGradient id="m029-metal" cx="35%" cy="28%" r="80%">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="0.5" stop-color="#bfc5cc"/>
			<stop offset="1" stop-color="#6b737c"/>
		</radialGradient>
		<linearGradient id="m029-rim" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="1" stop-color="#6b737c"/>
		</linearGradient>
		<linearGradient id="m029-gloss" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
