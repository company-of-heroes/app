		<circle cx="32" cy="47" r="3.4" fill="url(#m053-metal)" stroke="#3d434a" stroke-width="0.6"/><circle cx="32" cy="53" r="2.6" fill="none" stroke="url(#m053-rim)" stroke-width="1.6"/>
