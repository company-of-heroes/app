			<rect x="12" y="0" width="8" height="48" fill="#c23b3b"/><rect x="20" y="0" width="5.33" height="48" fill="#2f5a34"/><rect x="25.33" y="0" width="2.67" height="48" fill="#3f6fb0"/><rect x="28" y="0" width="8" height="48" fill="#c23b3b"/><rect x="36" y="0" width="2.67" height="48" fill="#3f6fb0"/><rect x="38.67" y="0" width="5.33" height="48" fill="#2f5a34"/><rect x="44" y="0" width="8" height="48" fill="#c23b3b"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m053-weave)"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m053-fold)"/>
