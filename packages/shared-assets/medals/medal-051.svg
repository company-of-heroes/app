			<rect x="12" y="0" width="13.33" height="48" fill="#8f2232"/><rect x="25.33" y="0" width="13.33" height="48" fill="#c23b3b"/><rect x="38.67" y="0" width="13.33" height="48" fill="#8f2232"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m051-weave)"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m051-fold)"/>
