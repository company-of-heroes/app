			<path d="M-24,0 A24,24 0 1 0 24,0 A24,24 0 1 0 -24,0 Z" fill="url(#m031-metal)" stroke="#3d434a" stroke-width="1"/><path d="M-24,0 A24,24 0 1 0 24,0 A24,24 0 1 0 -24,0 Z" transform="scale(0.82)" fill="none" stroke="#6b737c" stroke-width="0.9" opacity="0.8"/>
			<g transform="scale(1.15)" fill="#3d434a" color="#3d434a"><text y="5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="14">I</text></g>
		</g>
	</g>
