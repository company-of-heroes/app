<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 116" width="64" height="116">
	<title>Silver medal with numeral</title>
	<defs>
		<radialGradient id="m031-metal" cx="35%" cy="28%" r="80%">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="0.5" stop-color="#bfc5cc"/>
			<stop offset="1" stop-color="#6b737c"/>
		</radialGradient>
		<linearGradient id="m031-rim" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="1" stop-color="#6b737c"/>
		</linearGradient>
		<linearGradient id="m031-gloss" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
			<stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="m031-fold" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#000" stop-opacity="0.35"/>
			<stop offset="0.2" stop-color="#000" stop-opacity="0"/>
			<stop offset="0.8" stop-color="#000" stop-opacity="0"/>
			<stop offset="1" stop-color="#000" stop-opacity="0.35"/>
		</linearGradient>
		<pattern id="m031-weave" width="1.6" height="1.6" patternUnits="userSpaceOnUse">
			<rect width="0.6" height="1.6" fill="#000" opacity="0.12"/>
		</pattern>
		<clipPath id="m031-ribbon"><polygon points="12,0 52,0 52,44 12,44"/></clipPath>
		<filter id="m031-shadow" x="-30%" y="-30%" width="160%" height="160%">
			<feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity="0.55"/>
		</filter>
	</defs>
	<g>
		<g clip-path="url(#m031-ribbon)">
			<rect x="12" y="0" width="2.58" height="48" fill="#1c1c1c"/><rect x="14.58" y="0" width="5.16" height="48" fill="#24406b"/><rect x="19.74" y="0" width="10.32" height="48" fill="#1c1c1c"/><rect x="30.06" y="0" width="3.87" height="48" fill="#e6dfcc"/><rect x="33.94" y="0" width="10.32" height="48" fill="#1c1c1c"/><rect x="44.26" y="0" width="5.16" height="48" fill="#24406b"/><rect x="49.42" y="0" width="2.58" height="48" fill="#1c1c1c"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m031-weave)"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m031-fold)"/>
		</g>
		<ellipse cx="32" cy="48" rx="6" ry="4.5" fill="none" stroke="url(#m031-rim)" stroke-width="2"/>
