			<rect x="12" y="0" width="5" height="48" fill="#1c1c1c"/><rect x="17" y="0" width="30" height="48" fill="#c8642a"/><rect x="47" y="0" width="5" height="48" fill="#1c1c1c"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m017-weave)"/>
