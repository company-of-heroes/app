<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 116" width="64" height="116">
	<title>Silver blue enamel cross with tank</title>
	<defs>
		<radialGradient id="m025-metal" cx="35%" cy="28%" r="80%">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="0.5" stop-color="#bfc5cc"/>
			<stop offset="1" stop-color="#6b737c"/>
		</radialGradient>
		<linearGradient id="m025-rim" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="1" stop-color="#6b737c"/>
		</linearGradient>
		<linearGradient id="m025-gloss" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
			<stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="m025-fold" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#000" stop-opacity="0.35"/>
			<stop offset="0.2" stop-color="#000" stop-opacity="0"/>
			<stop offset="0.8" stop-color="#000" stop-opacity="0"/>
			<stop offset="1" stop-color="#000" stop-opacity="0.35"/>
		</linearGradient>
		<pattern id="m025-weave" width="1.6" height="1.6" patternUnits="userSpaceOnUse">
			<rect width="0.6" height="1.6" fill="#000" opacity="0.12"/>
		</pattern>
		<clipPath id="m025-ribbon"><polygon points="12,0 52,0 52,44 12,44"/></clipPath>
		<filter id="m025-shadow" x="-30%" y="-30%" width="160%" height="160%">
			<feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity="0.55"/>
		</filter>
	</defs>
	<g>
		<g clip-path="url(#m025-ribbon)">
			<rect x="12" y="0" width="5" height="48" fill="#56622e"/><rect x="17" y="0" width="30" height="48" fill="#24406b"/><rect x="47" y="0" width="5" height="48" fill="#56622e"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m025-weave)"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m025-fold)"/>
		</g>
		<circle cx="32" cy="48" r="4" fill="none" stroke="url(#m025-rim)" stroke-width="2"/>
		<g transform="translate(32 84)" filter="url(#m025-shadow)">
			<path d="M-12,-26 L12,-26 L5,-5 L26,-12 L26,12 L5,5 L12,26 L-12,26 L-5,5 L-26,12 L-26,-12 L-5,-5 Z" fill="url(#m025-metal)" stroke="#3d434a" stroke-width="1"/><path d="M-12,-26 L12,-26 L5,-5 L26,-12 L26,12 L5,5 L12,26 L-12,26 L-5,5 L-26,12 L-26,-12 L-5,-5 Z" transform="scale(0.8)" fill="#1f4f9a" stroke="#6b737c" stroke-width="1"/><path d="M-12,-26 L12,-26 L5,-5 L26,-12 L26,12 L5,5 L12,26 L-12,26 L-5,5 L-26,12 L-26,-12 L-5,-5 Z" transform="scale(0.8)" fill="url(#m025-gloss)"/><circle r="11" fill="url(#m025-metal)" stroke="#3d434a" stroke-width="0.8"/><circle r="9.2" fill="none" stroke="#6b737c" stroke-width="0.6"/>
			<g transform="scale(0.78)" fill="#3d434a" color="#3d434a"><rect x="-11" y="2" width="22" height="6" rx="3"/><rect x="-9" y="-2.5" width="18" height="4" rx="1"/><rect x="-5" y="-7" width="9" height="4.5" rx="1.5"/><rect x="3" y="-5.6" width="10" height="1.6" rx="0.5"/></g>
		</g>
