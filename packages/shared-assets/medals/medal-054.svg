<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 116" width="64" height="116">
	<title>Silver red enamel shield with torch</title>
	<defs>
		<radialGradient id="m054-metal" cx="35%" cy="28%" r="80%">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="0.5" stop-color="#bfc5cc"/>
			<stop offset="1" stop-color="#6b737c"/>
		</radialGradient>
		<linearGradient id="m054-rim" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="1" stop-color="#6b737c"/>
		</linearGradient>
		<linearGradient id="m054-gloss" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
			<stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="m054-fold" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#000" stop-opacity="0.35"/>
			<stop offset="0.2" stop-color="#000" stop-opacity="0"/>
			<stop offset="0.8" stop-color="#000" stop-opacity="0"/>
			<stop offset="1" stop-color="#000" stop-opacity="0.35"/>
		</linearGradient>
		<pattern id="m054-weave" width="1.6" height="1.6" patternUnits="userSpaceOnUse">
			<rect width="0.6" height="1.6" fill="#000" opacity="0.12"/>
		</pattern>
		<clipPath id="m054-ribbon"><polygon points="12,0 52,0 42,46 22,46"/></clipPath>
		<filter id="m054-shadow" x="-30%" y="-30%" width="160%" height="160%">
			<feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity="0.55"/>
		</filter>
	</defs>
	<g>
		<g clip-path="url(#m054-ribbon)">
			<rect x="12" y="0" width="6.49" height="48" fill="#e0b23a"/><rect x="18.49" y="0" width="8.65" height="48" fill="#c8642a"/><rect x="27.14" y="0" width="9.73" height="48" fill="#56622e"/><rect x="36.86" y="0" width="8.65" height="48" fill="#c8642a"/><rect x="45.51" y="0" width="6.49" height="48" fill="#e0b23a"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m054-weave)"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m054-fold)"/>
		</g>
		<circle cx="32" cy="50" r="4" fill="none" stroke="url(#m054-rim)" stroke-width="2"/>
		<g transform="translate(32 84)" filter="url(#m054-shadow)">
			<path d="M-21,-24 H21 V0 Q21,17 0,28 Q-21,17 -21,0 Z" fill="url(#m054-metal)" stroke="#3d434a" stroke-width="1"/><path d="M-21,-24 H21 V0 Q21,17 0,28 Q-21,17 -21,0 Z" transform="scale(0.72)" fill="#a3202f" stroke="#6b737c" stroke-width="1"/><path d="M-21,-24 H21 V0 Q21,17 0,28 Q-21,17 -21,0 Z" transform="scale(0.72)" fill="url(#m054-gloss)"/>
			<g transform="scale(1.15)" fill="#ffffff" color="#ffffff"><path d="M0,-12 Q4,-8 2.5,-5 Q4,-6 3.5,-3 L-3.5,-3 Q-4,-7 -1,-8 Q-2,-10 0,-12 Z"/><path d="M-3.5,-2 L3.5,-2 L1.5,11 L-1.5,11 Z"/></g>
		</g>
	</g>
</svg>
