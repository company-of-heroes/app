<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 116" width="64" height="116">
	<title>Gold shield with shell</title>
	<defs>
		<radialGradient id="m080-metal" cx="35%" cy="28%" r="80%">
			<stop offset="0" stop-color="#fff1bf"/>
			<stop offset="0.5" stop-color="#d6a640"/>
			<stop offset="1" stop-color="#86601a"/>
		</radialGradient>
		<linearGradient id="m080-rim" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#fff1bf"/>
			<stop offset="1" stop-color="#86601a"/>
		</linearGradient>
		<linearGradient id="m080-gloss" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
			<stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="m080-fold" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#000" stop-opacity="0.35"/>
			<stop offset="0.2" stop-color="#000" stop-opacity="0"/>
			<stop offset="0.8" stop-color="#000" stop-opacity="0"/>
			<stop offset="1" stop-color="#000" stop-opacity="0.35"/>
		</linearGradient>
		<pattern id="m080-weave" width="1.6" height="1.6" patternUnits="userSpaceOnUse">
			<rect width="0.6" height="1.6" fill="#000" opacity="0.12"/>
		</pattern>
		<clipPath id="m080-ribbon"><polygon points="12,0 52,0 52,44 12,44"/></clipPath>
		<filter id="m080-shadow" x="-30%" y="-30%" width="160%" height="160%">
			<feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity="0.55"/>
		</filter>
	</defs>
	<g>
		<g clip-path="url(#m080-ribbon)">
			<rect x="12" y="0" width="4.21" height="48" fill="#e0b23a"/><rect x="16.21" y="0" width="12.63" height="48" fill="#f4f1e8"/><rect x="28.84" y="0" width="6.32" height="48" fill="#c23b3b"/><rect x="35.16" y="0" width="12.63" height="48" fill="#f4f1e8"/><rect x="47.79" y="0" width="4.21" height="48" fill="#e0b23a"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m080-weave)"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m080-fold)"/>
		</g>
		<circle cx="32" cy="45" r="3.4" fill="url(#m080-metal)" stroke="#4f3a0c" stroke-width="0.6"/><circle cx="32" cy="51" r="2.6" fill="none" stroke="url(#m080-rim)" stroke-width="1.6"/>
		<g transform="translate(32 84)" filter="url(#m080-shadow)">
			<path d="M-21,-24 H21 V0 Q21,17 0,28 Q-21,17 -21,0 Z" fill="url(#m080-metal)" stroke="#4f3a0c" stroke-width="1"/><path d="M-21,-24 H21 V0 Q21,17 0,28 Q-21,17 -21,0 Z" transform="scale(0.82)" fill="none" stroke="#86601a" stroke-width="0.9" opacity="0.8"/>
			<g transform="scale(1.15)" fill="#4f3a0c" color="#4f3a0c"><path d="M-3.5,-4 Q-3.5,-11 0,-12 Q3.5,-11 3.5,-4 Z"/><rect x="-3.5" y="-3" width="7" height="10"/><rect x="-4.2" y="7.5" width="8.4" height="3" rx="0.6"/></g>
		</g>
	</g>
</svg>
