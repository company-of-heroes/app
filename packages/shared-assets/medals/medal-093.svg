<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 116" width="64" height="116">
	<title>Silver oval medal with helmet</title>
	<defs>
		<radialGradient id="m093-metal" cx="35%" cy="28%" r="80%">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="0.5" stop-color="#bfc5cc"/>
			<stop offset="1" stop-color="#6b737c"/>
		</radialGradient>
		<linearGradient id="m093-rim" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="1" stop-color="#6b737c"/>
		</linearGradient>
		<linearGradient id="m093-gloss" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
			<stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="m093-fold" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#000" stop-opacity="0.35"/>
			<stop offset="0.2" stop-color="#000" stop-opacity="0"/>
			<stop offset="0.8" stop-color="#000" stop-opacity="0"/>
			<stop offset="1" stop-color="#000" stop-opacity="0.35"/>
		</linearGradient>
		<pattern id="m093-weave" width="1.6" height="1.6" patternUnits="userSpaceOnUse">
			<rect width="0.6" height="1.6" fill="#000" opacity="0.12"/>
		</pattern>
		<clipPath id="m093-ribbon"><polygon points="12,0 52,0 52,44 12,44"/></clipPath>
		<filter id="m093-shadow" x="-30%" y="-30%" width="160%" height="160%">
			<feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity="0.55"/>
		</filter>
	</defs>
	<g>
		<g clip-path="url(#m093-ribbon)">
			<rect x="12" y="0" width="6" height="48" fill="#24406b"/><rect x="18" y="0" width="2" height="48" fill="#e0b23a"/><rect x="20" y="0" width="6" height="48" fill="#3f6fb0"/><rect x="26" y="0" width="12" height="48" fill="#2f5a34"/><rect x="38" y="0" width="6" height="48" fill="#3f6fb0"/><rect x="44" y="0" width="2" height="48" fill="#e0b23a"/><rect x="46" y="0" width="6" height="48" fill="#24406b"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m093-weave)"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m093-fold)"/>
		</g>
		<ellipse cx="32" cy="48" rx="6" ry="4.5" fill="none" stroke="url(#m093-rim)" stroke-width="2"/>
