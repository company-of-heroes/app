			<rect x="12" y="0" width="3.08" height="48" fill="#56622e"/><rect x="15.08" y="0" width="12.31" height="48" fill="#3f6fb0"/><rect x="27.38" y="0" width="9.23" height="48" fill="#2f5a34"/><rect x="36.62" y="0" width="12.31" height="48" fill="#3f6fb0"/><rect x="48.92" y="0" width="3.08" height="48" fill="#56622e"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m095-weave)"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m095-fold)"/>
