			<g transform="scale(1.15)" fill="#ffffff" color="#ffffff"><circle r="7.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle r="1.6"/><rect x="-0.7" y="-11" width="1.4" height="6"/><rect x="-0.7" y="5" width="1.4" height="6"/><rect x="-11" y="-0.7" width="6" height="1.4"/><rect x="5" y="-0.7" width="6" height="1.4"/></g>
