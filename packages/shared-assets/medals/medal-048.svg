<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 116" width="64" height="116">
	<title>Bronze oval medal with numeral</title>
	<defs>
		<radialGradient id="m048-metal" cx="35%" cy="28%" r="80%">
			<stop offset="0" stop-color="#f6c79a"/>
			<stop offset="0.5" stop-color="#b4733a"/>
			<stop offset="1" stop-color="#6b3d18"/>
		</radialGradient>
		<linearGradient id="m048-rim" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#f6c79a"/>
			<stop offset="1" stop-color="#6b3d18"/>
		</linearGradient>
		<linearGradient id="m048-gloss" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
			<stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="m048-fold" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#000" stop-opacity="0.35"/>
			<stop offset="0.2" stop-color="#000" stop-opacity="0"/>
			<stop offset="0.8" stop-color="#000" stop-opacity="0"/>
			<stop offset="1" stop-color="#000" stop-opacity="0.35"/>
		</linearGradient>
		<pattern id="m048-weave" width="1.6" height="1.6" patternUnits="userSpaceOnUse">
			<rect width="0.6" height="1.6" fill="#000" opacity="0.12"/>
		</pattern>
		<clipPath id="m048-ribbon"><polygon points="12,0 52,0 52,46 32,38 12,46"/></clipPath>
		<filter id="m048-shadow" x="-30%" y="-30%" width="160%" height="160%">
			<feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity="0.55"/>
		</filter>
	</defs>
	<g>
		<g clip-path="url(#m048-ribbon)">
			<rect x="12" y="0" width="3.2" height="48" fill="#1c1c1c"/><rect x="15.2" y="0" width="9.6" height="48" fill="#b8924a"/><rect x="24.8" y="0" width="14.4" height="48" fill="#3f6fb0"/><rect x="39.2" y="0" width="9.6" height="48" fill="#b8924a"/><rect x="48.8" y="0" width="3.2" height="48" fill="#1c1c1c"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m048-weave)"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m048-fold)"/>
		</g>
		<rect x="20" y="40" width="24" height="6" rx="1.5" fill="url(#m048-rim)" stroke="#3f230b" stroke-width="0.8"/><circle cx="32" cy="49" r="3" fill="none" stroke="url(#m048-rim)" stroke-width="1.8"/>
		<g transform="translate(32 84)" filter="url(#m048-shadow)">
			<path d="M-20,0 A20,26 0 1 0 20,0 A20,26 0 1 0 -20,0 Z" fill="url(#m048-metal)" stroke="#3f230b" stroke-width="1"/><path d="M-20,0 A20,26 0 1 0 20,0 A20,26 0 1 0 -20,0 Z" transform="scale(0.82)" fill="none" stroke="#6b3d18" stroke-width="0.9" opacity="0.8"/>
			<g transform="scale(1.15)" fill="#3f230b" color="#3f230b"><text y="5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="11">III</text></g>
		</g>
	</g>
</svg>
