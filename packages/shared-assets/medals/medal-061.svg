		<circle cx="32" cy="48" r="4" fill="none" stroke="url(#m061-rim)" stroke-width="2"/>
		<g transform="translate(32 84)" filter="url(#m061-shadow)">
			<path d="M0,-29 L22,0 L0,29 L-22,0 Z" fill="url(#m061-metal)" stroke="#3f230b" stroke-width="1"/><path d="M0,-29 L22,0 L0,29 L-22,0 Z" transform="scale(0.8)" fill="#a3202f" stroke="#6b3d18" stroke-width="1"/><path d="M0,-29 L22,0 L0,29 L-22,0 Z" transform="scale(0.8)" fill="url(#m061-gloss)"/><circle r="11" fill="url(#m061-metal)" stroke="#3f230b" stroke-width="0.8"/><circle r="9.2" fill="none" stroke="#6b3d18" stroke-width="0.6"/>
			<g transform="scale(0.78)" fill="#3f230b" color="#3f230b"><path d="M-3.5,-4 Q-3.5,-11 0,-12 Q3.5,-11 3.5,-4 Z"/><rect x="-3.5" y="-3" width="7" height="10"/><rect x="-4.2" y="7.5" width="8.4" height="3" rx="0.6"/></g>
		</g>
