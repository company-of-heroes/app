<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 116" width="64" height="116">
	<title>Bronze red enamel diamond with shell</title>
	<defs>
		<radialGradient id="m061-metal" cx="35%" cy="28%" r="80%">
			<stop offset="0" stop-color="#f6c79a"/>
			<stop offset="0.5" stop-color="#b4733a"/>
			<stop offset="1" stop-color="#6b3d18"/>
		</radialGradient>
		<linearGradient id="m061-rim" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#f6c79a"/>
			<stop offset="1" stop-color="#6b3d18"/>
		</linearGradient>
		<linearGradient id="m061-gloss" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
			<stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="m061-fold" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#000" stop-opacity="0.35"/>
			<stop offset="0.2" stop-color="#000" stop-opacity="0"/>
			<stop offset="0.8" stop-color="#000" stop-opacity="0"/>
			<stop offset="1" stop-color="#000" stop-opacity="0.35"/>
		</linearGradient>
		<pattern id="m061-weave" width="1.6" height="1.6" patternUnits="userSpaceOnUse">
			<rect width="0.6" height="1.6" fill="#000" opacity="0.12"/>
		</pattern>
		<clipPath id="m061-ribbon"><polygon points="12,0 52,0 52,44 12,44"/></clipPath>
		<filter id="m061-shadow" x="-30%" y="-30%" width="160%" height="160%">
			<feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity="0.55"/>
		</filter>
	</defs>
	<g>
		<g clip-path="url(#m061-ribbon)">
			<rect x="12" y="0" width="1.82" height="48" fill="#f4f1e8"/><rect x="13.82" y="0" width="3.64" height="48" fill="#8f2232"/><rect x="17.45" y="0" width="7.27" height="48" fill="#e0b23a"/><rect x="24.73" y="0" width="1.82" height="48" fill="#b8924a"/><rect x="26.55" y="0" width="10.91" height="48" fill="#c8642a"/><rect x="37.45" y="0" width="1.82" height="48" fill="#b8924a"/><rect x="39.27" y="0" width="7.27" height="48" fill="#e0b23a"/><rect x="46.55" y="0" width="3.64" height="48" fill="#8f2232"/><rect x="50.18" y="0" width="1.82" height="48" fill="#f4f1e8"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m061-weave)"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m061-fold)"/>
