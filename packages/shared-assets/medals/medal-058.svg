<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 116" width="64" height="116">
	<title>Bronze red enamel shield with numeral</title>
	<defs>
		<radialGradient id="m058-metal" cx="35%" cy="28%" r="80%">
			<stop offset="0" stop-color="#f6c79a"/>
			<stop offset="0.5" stop-color="#b4733a"/>
			<stop offset="1" stop-color="#6b3d18"/>
		</radialGradient>
		<linearGradient id="m058-rim" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#f6c79a"/>
			<stop offset="1" stop-color="#6b3d18"/>
		</linearGradient>
		<linearGradient id="m058-gloss" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
			<stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="m058-fold" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#000" stop-opacity="0.35"/>
			<stop offset="0.2" stop-color="#000" stop-opacity="0"/>
			<stop offset="0.8" stop-color="#000" stop-opacity="0"/>
			<stop offset="1" stop-color="#000" stop-opacity="0.35"/>
		</linearGradient>
		<pattern id="m058-weave" width="1.6" height="1.6" patternUnits="userSpaceOnUse">
			<rect width="0.6" height="1.6" fill="#000" opacity="0.12"/>
		</pattern>
		<clipPath id="m058-ribbon"><polygon points="12,0 52,0 52,40 32,47 12,40"/></clipPath>
		<filter id="m058-shadow" x="-30%" y="-30%" width="160%" height="160%">
			<feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity="0.55"/>
		</filter>
	</defs>
	<g>
		<g clip-path="url(#m058-ribbon)">
			<rect x="12" y="0" width="5.71" height="48" fill="#1c1c1c"/><rect x="17.71" y="0" width="5.71" height="48" fill="#e6dfcc"/><rect x="23.43" y="0" width="5.71" height="48" fill="#6b2d5c"/><rect x="29.14" y="0" width="5.71" height="48" fill="#e6dfcc"/><rect x="34.86" y="0" width="5.71" height="48" fill="#6b2d5c"/><rect x="40.57" y="0" width="5.71" height="48" fill="#e6dfcc"/><rect x="46.29" y="0" width="5.71" height="48" fill="#1c1c1c"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m058-weave)"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m058-fold)"/>
		</g>
		<circle cx="32" cy="50" r="4" fill="none" stroke="url(#m058-rim)" stroke-width="2"/>
		<g transform="translate(32 84)" filter="url(#m058-shadow)">
			<path d="M-21,-24 H21 V0 Q21,17 0,28 Q-21,17 -21,0 Z" fill="url(#m058-metal)" stroke="#3f230b" stroke-width="1"/><path d="M-21,-24 H21 V0 Q21,17 0,28 Q-21,17 -21,0 Z" transform="scale(0.72)" fill="#a3202f" stroke="#6b3d18" stroke-width="1"/><path d="M-21,-24 H21 V0 Q21,17 0,28 Q-21,17 -21,0 Z" transform="scale(0.72)" fill="url(#m058-gloss)"/>
			<g transform="scale(1.15)" fill="#f6c79a" color="#f6c79a"><text y="5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="14">II</text></g>
		</g>
	</g>
