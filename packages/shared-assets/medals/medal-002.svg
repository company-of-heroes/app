<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 116" width="64" height="116">
	<title>Gold shield with helmet</title>
	<defs>
		<radialGradient id="m002-metal" cx="35%" cy="28%" r="80%">
			<stop offset="0" stop-color="#fff1bf"/>
			<stop offset="0.5" stop-color="#d6a640"/>
			<stop offset="1" stop-color="#86601a"/>
		</radialGradient>
		<linearGradient id="m002-rim" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#fff1bf"/>
			<stop offset="1" stop-color="#86601a"/>
		</linearGradient>
		<linearGradient id="m002-gloss" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
			<stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="m002-fold" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#000" stop-opacity="0.35"/>
			<stop offset="0.2" stop-color="#000" stop-opacity="0"/>
			<stop offset="0.8" stop-color="#000" stop-opacity="0"/>
			<stop offset="1" stop-color="#000" stop-opacity="0.35"/>
		</linearGradient>
		<pattern id="m002-weave" width="1.6" height="1.6" patternUnits="userSpaceOnUse">
			<rect width="0.6" height="1.6" fill="#000" opacity="0.12"/>
		</pattern>
		<clipPath id="m002-ribbon"><polygon points="12,0 52,0 52,46 32,38 12,46"/></clipPath>
		<filter id="m002-shadow" x="-30%" y="-30%" width="160%" height="160%">
			<feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity="0.55"/>
		</filter>
	</defs>
	<g>
		<g clip-path="url(#m002-ribbon)">
			<rect x="12" y="0" width="5.42" height="48" fill="#6b2d5c"/><rect x="17.42" y="0" width="2.71" height="48" fill="#f4f1e8"/><rect x="20.14" y="0" width="5.42" height="48" fill="#56622e"/><rect x="25.56" y="0" width="5.42" height="48" fill="#1c1c1c"/><rect x="30.98" y="0" width="2.03" height="48" fill="#2f5a34"/><rect x="33.02" y="0" width="5.42" height="48" fill="#1c1c1c"/><rect x="38.44" y="0" width="5.42" height="48" fill="#56622e"/><rect x="43.86" y="0" width="2.71" height="48" fill="#f4f1e8"/><rect x="46.58" y="0" width="5.42" height="48" fill="#6b2d5c"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m002-weave)"/>
			<rect x="12" y="0" width="40" height="48" fill="url(#m002-fold)"/>
