		<circle cx="32" cy="43" r="3.4" fill="url(#m002-metal)" stroke="#4f3a0c" stroke-width="0.6"/><circle cx="32" cy="49" r="2.6" fill="none" stroke="url(#m002-rim)" stroke-width="1.6"/>
		<g transform="translate(32 84)" filter="url(#m002-shadow)">
			<path d="M-21,-24 H21 V0 Q21,17 0,28 Q-21,17 -21,0 Z" fill="url(#m002-metal)" stroke="#4f3a0c" stroke-width="1"/><path d="M-21,-24 H21 V0 Q21,17 0,28 Q-21,17 -21,0 Z" transform="scale(0.82)" fill="none" stroke="#86601a" stroke-width="0.9" opacity="0.8"/>
			<g transform="scale(1.15)" fill="#4f3a0c" color="#4f3a0c"><path d="M-10,3 Q-10,-9 0,-9 Q10,-9 10,3 L13,4.5 L13,6 L-13,6 L-13,4.5 Z"/><rect x="-7" y="7.5" width="14" height="1.2" rx="0.6"/></g>
		</g>
