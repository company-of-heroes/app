name = "coh1stats-website"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2025-07-10"
compatibility_flags = ["nodejs_als"]

# Run close to PocketBase: most requests make several round-trips to it.
[placement]
mode = "smart"

# Secrets (wrangler secret put): PB_SUPERUSER_EMAIL, PB_SUPERUSER_PASSWORD (a dedicated superuser
# without MFA; PB_SUPERUSER_TOKEN overrides the login), SERVICE_TOKEN, REPLAY_PROXY_SECRET,
# STEAM_API_KEY, AUTH_HANDOFF_SECRET, TWITCH_CLIENT_ID, TWITCH_CLIENT_SECRET,
# YOUTUBE_CLIENT_ID, YOUTUBE_CLIENT_SECRET

# Replay download limits per IP (src/lib/server/downloads.ts); namespace ids are account-unique.
[[ratelimits]]
name = "DOWNLOAD_BURST"
namespace_id = "1001"
simple = { limit = 10, period = 10 }

[[ratelimits]]
name = "DOWNLOAD_MINUTE"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "FILE_BURST"
namespace_id = "1003"
simple = { limit = 8, period = 10 }

[[ratelimits]]
name = "FILE_MINUTE"
namespace_id = "1004"
simple = { limit = 40, period = 60 }

# Published OBS overlays ({userId}/…), served by the api-gateway.
[[r2_buckets]]
binding = "OVERLAYS"
bucket_name = "coh1stats-overlays"

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"
