name = "coh1stats-website"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2025-07-10"
compatibility_flags = ["nodejs_als"]

# Run close to PocketBase: most requests make several round-trips to it.
[placement]
mode = "smart"

[observability.logs]
enabled = true
invocation_logs = true

# Secrets (wrangler secret put): PB_SUPERUSER_EMAIL, PB_SUPERUSER_PASSWORD (a dedicated superuser
# without MFA; PB_SUPERUSER_TOKEN overrides the login), SERVICE_TOKEN, REPLAY_PROXY_SECRET,
# STEAM_API_KEY, AUTH_HANDOFF_SECRET, TWITCH_CLIENT_ID, TWITCH_CLIENT_SECRET,
# YOUTUBE_CLIENT_ID, YOUTUBE_CLIENT_SECRET, AUTH_TOKEN_SECRET (PocketBase's /api/_auth/token,
# same value there), SMURF_SERVICE_TOKEN (the smurf worker's own token, same value there)
# Mollie secret: MOLLIE_API_KEY (supporter subscription; a `test_…` key is test mode, a
# `live_…` key takes real payments).

# Mollie webhooks (POST /api/mollie/webhook) are sent to this origin; empty skips them.
[vars]
MOLLIE_WEBHOOK_ORIGIN = "https://coh1stats.com"

# Replay download limits per IP (src/lib/server/downloads.ts); namespace ids are account-unique.
[[ratelimits]]
name = "DOWNLOAD_BURST"
namespace_id = "1001"
simple = { limit = 10, period = 10 }

[[ratelimits]]
name = "DOWNLOAD_MINUTE"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "FILE_BURST"
namespace_id = "1003"
simple = { limit = 8, period = 10 }

[[ratelimits]]
name = "FILE_MINUTE"
namespace_id = "1004"
simple = { limit = 40, period = 60 }

# Supporter card PNG uploads per account (POST src/routes/api/v1/players/[id]/card.png).
[[ratelimits]]
name = "CARD_LIMITER"
namespace_id = "1005"
simple = { limit = 10, period = 60 }

# Published OBS overlays ({userId}/…), served by the api-gateway, and supporter card PNGs
# (cards/{steamId}.png), served by the website.
[[r2_buckets]]
binding = "OVERLAYS"
bucket_name = "coh1stats-overlays"

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"
