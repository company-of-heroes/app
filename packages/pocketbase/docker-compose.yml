services:
  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fknoobscoh-pocketbase
    ports:
      - '${PB_PORT:-8090}:${PB_PORT:-8090}'
    volumes:
      - pocketbase_data:/pb_data
    environment:
      - PB_PORT=${PB_PORT:-8090}
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD}
      # Only the website may call /api/_relic (same value as its SERVICE_TOKEN) and
      # /api/_auth/token (AUTH_TOKEN_SECRET, same value as the website's; SERVICE_TOKEN until set).
      - SERVICE_TOKEN=${SERVICE_TOKEN}
      - AUTH_TOKEN_SECRET=${AUTH_TOKEN_SECRET}
    env_file:
      - path: ./.env
        required: false
    restart: unless-stopped
volumes:
  pocketbase_data:
