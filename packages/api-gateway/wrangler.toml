# Sits in front of api.coh1stats.com (PocketBase) on the legacy custom-route paths.
# Paths listed in src/routes.ts are served by the website's /api/v1; everything
# else on a matched route passes through to PocketBase unchanged.
name = "coh1stats-api-gateway"
main = "src/index.ts"
compatibility_date = "2025-07-10"

# One route per legacy prefix in src/routes.ts, plus the overlays. Paths a route matches
# but no rule rewrites pass through to PocketBase unchanged. Collection write paths older
# apps use also need a route; reads on those paths pass through. /api/files/* only gets a
# rate limit (add it once REPLAY_PROXY_SECRET is set here and on the website).
# Realtime must never match a route. Overlays are served from their own host (a custom
# domain: Cloudflare creates its DNS record); /overlay* on the API host redirects there.
routes = [
	{ pattern = "overlay.coh1stats.com", custom_domain = true },
	{ pattern = "api.coh1stats.com/overlay*", zone_name = "coh1stats.com" },
	{ pattern = "api.coh1stats.com/api/overlay/*", zone_name = "coh1stats.com" },
	{ pattern = "api.coh1stats.com/api/match*", zone_name = "coh1stats.com" },
	{ pattern = "api.coh1stats.com/api/history-*", zone_name = "coh1stats.com" },
	{ pattern = "api.coh1stats.com/api/twitch/*", zone_name = "coh1stats.com" },
	{ pattern = "api.coh1stats.com/api/leaderboard/*", zone_name = "coh1stats.com" },
	{ pattern = "api.coh1stats.com/api/player*", zone_name = "coh1stats.com" },
	{ pattern = "api.coh1stats.com/api/member-replays*", zone_name = "coh1stats.com" },
	{ pattern = "api.coh1stats.com/api/replay-filters*", zone_name = "coh1stats.com" },
	{ pattern = "api.coh1stats.com/api/smurf-watch/*", zone_name = "coh1stats.com" },
	{ pattern = "api.coh1stats.com/api/live-lobbies*", zone_name = "coh1stats.com" },
	{ pattern = "api.coh1stats.com/api/auth/*", zone_name = "coh1stats.com" },
	{ pattern = "api.coh1stats.com/api/impersonate/*", zone_name = "coh1stats.com" },
	{ pattern = "api.coh1stats.com/api/lobbies/*", zone_name = "coh1stats.com" },
	{ pattern = "api.coh1stats.com/api/collections/lobbies/*", zone_name = "coh1stats.com" },
	{ pattern = "api.coh1stats.com/api/collections/lobbies_live/*", zone_name = "coh1stats.com" },
	{ pattern = "api.coh1stats.com/api/collections/hidden_matches/*", zone_name = "coh1stats.com" },
	{ pattern = "api.coh1stats.com/api/collections/hidden_match_keywords/*", zone_name = "coh1stats.com" },
	{ pattern = "api.coh1stats.com/api/collections/lobby_likes/*", zone_name = "coh1stats.com" },
	{ pattern = "api.coh1stats.com/api/collections/replay_likes/*", zone_name = "coh1stats.com" },
	{ pattern = "api.coh1stats.com/api/collections/lobby_comments/*", zone_name = "coh1stats.com" },
	{ pattern = "api.coh1stats.com/api/collections/replay_comments/*", zone_name = "coh1stats.com" },
	{ pattern = "api.coh1stats.com/api/collections/lobby_comment_likes/*", zone_name = "coh1stats.com" },
	{ pattern = "api.coh1stats.com/api/collections/replay_comment_likes/*", zone_name = "coh1stats.com" },
	{ pattern = "api.coh1stats.com/api/collections/player_likes/*", zone_name = "coh1stats.com" }
]

[[services]]
binding = "WEBSITE"
service = "coh1stats-website"

# OBS overlays (/overlay/{userId}/…): published files in R2, default overlay as assets
# (built by packages/oppbot-overlay into overlay-default/).
[[r2_buckets]]
binding = "OVERLAYS"
bucket_name = "coh1stats-overlays"

[assets]
directory = "overlay-default"
binding = "DEFAULT_OVERLAY"
run_worker_first = true

# Replay file downloads per IP (src/files.ts; route api.coh1stats.com/api/files/*).
# Secret REPLAY_PROXY_SECRET (same as the website) lets the website's own file fetches through.
# Namespace ids are account-unique (the website uses 1001-1004).
[[ratelimits]]
name = "FILE_BURST"
namespace_id = "1011"
simple = { limit = 8, period = 10 }

[[ratelimits]]
name = "FILE_MINUTE"
namespace_id = "1012"
simple = { limit = 40, period = 60 }

[[ratelimits]]
name = "FILE_AUTH_BURST"
namespace_id = "1013"
simple = { limit = 20, period = 10 }

[[ratelimits]]
name = "FILE_AUTH_MINUTE"
namespace_id = "1014"
simple = { limit = 90, period = 60 }

[observability.logs]
enabled = true
invocation_logs = true
