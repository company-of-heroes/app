			#boot-splash {
				position: fixed;
				inset: 0;
				z-index: 2147483647;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1rem;
				background: oklch(29% 0.003 285);
			}

			#boot-splash .boot-splash-label {
				margin: 0;
				color: oklch(57% 0.006 285);
				font-family:
					system-ui,
					-apple-system,
					sans-serif;
				font-size: 0.75rem;
				font-weight: 600;
			}

			#boot-splash .boot-splash-loader {
				--w: 10ch;
				--c: oklch(84% 0.003 285);
				width: var(--w);
				overflow: hidden;
				font-family: monospace;
				font-size: 30px;
				font-weight: bold;
				line-height: 1.4em;
				letter-spacing: var(--w);
				white-space: nowrap;
				color: #0000;
				text-shadow:
					calc(0 * var(--w)) 0 var(--c),
					calc(-1 * var(--w)) 0 var(--c),
					calc(-2 * var(--w)) 0 var(--c),
					calc(-3 * var(--w)) 0 var(--c),
					calc(-4 * var(--w)) 0 var(--c),
					calc(-5 * var(--w)) 0 var(--c),
					calc(-6 * var(--w)) 0 var(--c),
					calc(-7 * var(--w)) 0 var(--c),
					calc(-8 * var(--w)) 0 var(--c),
					calc(-9 * var(--w)) 0 var(--c);
				animation: boot-splash-wave 2s infinite linear;
			}

			#boot-splash .boot-splash-loader::before {
				content: 'Loading...';
			}

			@keyframes boot-splash-wave {
				9.09% {
					text-shadow:
						calc(0 * var(--w)) -10px var(--c),
						calc(-1 * var(--w)) 0 var(--c),
						calc(-2 * var(--w)) 0 var(--c),
