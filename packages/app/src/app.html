<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Company of Heroes Companion - created by Fknoobs</title>
		<style>
			#boot-splash {
				position: fixed;
				inset: 0;
				z-index: 2147483647;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1.25rem;
				background: oklch(29% 0.003 285);
				color: oklch(75% 0.004 285);
				font-family:
					system-ui,
					-apple-system,
					sans-serif;
				font-size: 1rem;
				font-weight: 600;
			}

			/* Empty slot where the animated logo draws in once Svelte mounts. */
			#boot-splash .boot-splash-logo {
				width: 96px;
				height: 96px;
			}

			#boot-splash .boot-splash-status {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 0.75rem;
				margin-top: 1.5rem;
			}

			#boot-splash .boot-splash-label {
				margin: 0;
			}

			#boot-splash .boot-splash-track {
				width: 13rem;
				height: 3px;
				border-radius: 9999px;
				background: oklch(35% 0.004 285);
			}

			#boot-splash .boot-splash-tip {
				height: 3rem;
				margin-top: 2.5rem;
			}
		</style>
		%sveltekit.head%
	</head>
	<body class="overflow-hidden text-white">
		<div id="boot-splash" aria-live="polite" aria-busy="true">
			<div class="boot-splash-logo" aria-hidden="true"></div>
			<div class="boot-splash-status">
				<p class="boot-splash-label">Starting...</p>
				<div class="boot-splash-track" aria-hidden="true"></div>
			</div>
			<div class="boot-splash-tip" aria-hidden="true"></div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			// Fresh loads boot via /splashscreen, which removes this itself.
			if (/^\/setup\/?$/.test(location.pathname)) {
				document.getElementById('boot-splash')?.remove();
			}
		</script>
	</body>
</html>
