name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Prevent overlapping runs from racing on the Version Packages PR.
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has-changesets: ${{ steps.check.outputs.has-changesets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # changesets/action only checks whether `.changeset` contains any files. A
      # changeset that our version script cannot act on would make it version
      # nothing, force-push an unchanged branch and then fail on "No commits
      # between master and changeset-release/master".
      - name: Check for versionable changesets
        id: check
        run: echo "has-changesets=$(node scripts/version.mjs --check)" >> "$GITHUB_OUTPUT"

      # When changesets exist on master, this opens/updates a "Version Packages" PR
      # that runs `pnpm version-packages` (bumps package.json, tauri.conf.json and
      # Cargo.toml, prepends CHANGELOG.md and removes the consumed changesets).
      # Merging that PR tags v{app version} and starts the desktop release.
      - name: Create Version Packages PR
        if: steps.check.outputs.has-changesets == 'true'
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # After the Version Packages PR is merged there are no pending changesets.
  # Tag v{tauri.conf.json version} on this commit if that tag does not exist yet.
  # GITHUB_TOKEN tag pushes do not start other workflows, so Desktop Release is
  # invoked via workflow_call below instead of relying on the tag push.
  tag:
    name: Tag app version
    needs: version
    if: needs.version.outputs.has-changesets != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should-release: ${{ steps.tag.outputs.should-release }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create tag if missing
        id: tag
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' packages/app/src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Could not read app version from tauri.conf.json"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}"; then
            echo "Tag v${VERSION} already exists"
            echo "should-release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          echo "Created tag v${VERSION}"
          echo "should-release=true" >> "$GITHUB_OUTPUT"

  desktop-release:
    name: Desktop release
    needs: tag
    if: needs.tag.outputs.should-release == 'true'
    uses: ./.github/workflows/windows-release.yml
    secrets: inherit
    permissions:
      contents: write

  # Same flow for the replay parser, tagged replay-parser-v{version} so it never
  # collides with the app's v* tags.
  tag-replay-parser:
    name: Tag replay parser version
    needs: version
    if: needs.version.outputs.has-changesets != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should-release: ${{ steps.tag.outputs.should-release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create tag if missing
        id: tag
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' packages/replay-parser/src-tauri/tauri.conf.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Could not read replay parser version from tauri.conf.json"
            exit 1
          fi
          TAG="replay-parser-v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}"; then
            echo "Tag ${TAG} already exists"
            echo "should-release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag "${TAG}"
          git push origin "${TAG}"
          echo "Created tag ${TAG}"
          echo "should-release=true" >> "$GITHUB_OUTPUT"

  replay-parser-release:
    name: Replay parser release
    needs: tag-replay-parser
    if: needs.tag-replay-parser.outputs.should-release == 'true'
    uses: ./.github/workflows/replay-parser-release.yml
    secrets: inherit
    permissions:
      contents: write
