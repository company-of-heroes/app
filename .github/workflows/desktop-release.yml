name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  # Called from Release after the Version Packages PR is merged and tagged.
  # GITHUB_TOKEN tag pushes do not trigger this workflow on their own.
  workflow_call:

# Do not use github.workflow here: in a workflow_call it is the caller name
# ("Release"), which would share Release-refs/heads/master with the parent
# and GitHub cancels both as a deadlock.
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # One draft release up front, so the Windows and Linux builds never race to
  # create it. It is published by `finalize` once every asset is uploaded.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.release.outputs.release-id }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' packages/app/src-tauri/tauri.conf.json)
          TAG="v${VERSION}"
          # A published release is final: never add a new build to it (e.g. a manual
          # run before the version was bumped). A draft is a retry of this workflow.
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null)" = "false" ]; then
            echo "::error::$TAG is already published. Bump the version (changesets) before releasing."
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" \
              --notes 'See the changelog in the app or on GitHub.'
          fi
          {
            echo "release-id=$(gh release view "$TAG" --json databaseId -q .databaseId)"
            echo "tag=$TAG"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis,msi
          # Oldest supported Ubuntu: the AppImage links against its glibc, so it
          # runs on every distro that is at least this new.
          - platform: ubuntu-22.04
            args: --bundles appimage,deb
    runs-on: ${{ matrix.platform }}
    env:
      HAS_LINUX_GPG: ${{ secrets.LINUX_GPG_PRIVATE_KEY != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libxdo-dev libdbus-1-dev libssl-dev             gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Authenticode via Azure Artifact Signing. Inert until AZURE_CLIENT_ID is set.
      # Secrets: AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID
      # Variables: AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT
      # Optional variable: AZURE_SIGNING_PROFILE (defaults to coh1stats)
      - name: Enable Windows Authenticode signing
        id: codesign
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          if (-not $env:AZURE_CLIENT_ID) {
            Write-Host "Skipping Authenticode signing; AZURE_CLIENT_ID is not set."
            echo 'enabled=false' >> $env:GITHUB_OUTPUT
            echo 'args=' >> $env:GITHUB_OUTPUT
            return
          }
          foreach ($name in @('AZURE_CLIENT_SECRET', 'AZURE_TENANT_ID', 'AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_ACCOUNT')) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name" -ErrorAction SilentlyContinue).Value)) {
              throw "$name is required when AZURE_CLIENT_ID is set."
            }
          }
          $profile = if ($env:AZURE_SIGNING_PROFILE) { $env:AZURE_SIGNING_PROFILE } else { 'coh1stats' }
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64\signtool.exe' } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $signtool) {
            throw 'signtool.exe not found. Install a Windows 10/11 SDK on the runner.'
          }
          $az = 'C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin\az.cmd'
          if (-not (Test-Path $az)) {
            throw "Azure CLI not found at $az"
          }
          $tools = Join-Path $env:RUNNER_TEMP 'artifact-signing'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $cli = Join-Path $tools 'artifact-signing-cli.exe'
          Invoke-WebRequest -Uri 'https://github.com/Levminer/artifact-signing-cli/releases/download/0.11.0/artifact-signing-cli.exe' -OutFile $cli
          & $cli --help | Out-Host
          az login --service-principal --tenant $env:AZURE_TENANT_ID --username $env:AZURE_CLIENT_ID --password $env:AZURE_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) {
            throw 'Azure service principal login failed. Check AZURE_CLIENT_ID / SECRET / TENANT_ID and the Artifact Signing Certificate Profile Signer role.'
          }
          $endpoint = $env:AZURE_SIGNING_ENDPOINT.TrimEnd('/')
          $overlay = @{
            bundle = @{
              windows = @{
                signCommand = @{
                  cmd = $cli
                  args = @(
                    '--sign-tool-path', $signtool,
                    '--azure-cli-path', $az,
                    '-e', $endpoint,
                    '-a', $env:AZURE_SIGNING_ACCOUNT,
                    '-c', $profile,
                    '-d', 'Company of Heroes - Companion',
                    '%1'
                  )
                }
              }
            }
          } | ConvertTo-Json -Depth 8
          $overlayPath = Join-Path $pwd 'packages/app/src-tauri/tauri.codesign.conf.json'
          [System.IO.File]::WriteAllText($overlayPath, $overlay)
          Write-Host $overlay
          echo "SIGNTOOL_PATH=$signtool" >> $env:GITHUB_ENV
          echo "AZURE_CLI_PATH=$az" >> $env:GITHUB_ENV
          echo $tools >> $env:GITHUB_PATH
          echo 'enabled=true' >> $env:GITHUB_OUTPUT
          echo 'args= --verbose --config src-tauri/tauri.codesign.conf.json' >> $env:GITHUB_OUTPUT
          echo "signtool=$signtool" >> $env:GITHUB_OUTPUT
          Write-Host "Authenticode signing enabled ($endpoint / $($env:AZURE_SIGNING_ACCOUNT) / $profile)"
          Write-Host "signtool: $signtool"

      - name: Setup .NET
        if: steps.codesign.outputs.enabled == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Write app env
        shell: pwsh
        run: |
          $pbUrl = if ('${{ vars.PUBLIC_PB_URL }}') { '${{ vars.PUBLIC_PB_URL }}' } else { 'https://api.coh1stats.com' }
          $siteUrl = if ('${{ vars.PUBLIC_SITE_URL }}') { '${{ vars.PUBLIC_SITE_URL }}' } else { 'https://coh1stats.com' }
          $envFile = "PUBLIC_PB_URL=$pbUrl`nPUBLIC_SITE_URL=$siteUrl`n"
          [System.IO.File]::WriteAllText((Join-Path $pwd 'packages/app/.env.production'), $envFile)

      # Linux has no Authenticode: updates are verified with the Tauri updater key,
      # and the AppImage gets an embedded GPG signature once these secrets are set.
      # Secrets: LINUX_GPG_PRIVATE_KEY (armored), optional LINUX_GPG_PASSPHRASE
      - name: Enable AppImage GPG signing
        id: gpg
        if: runner.os == 'Linux' && env.HAS_LINUX_GPG == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ { print $5; exit }')
          gpg --armor --export "$KEY_ID" > "$RUNNER_TEMP/coh1stats-linux.asc"
          {
            echo "SIGN=1"
            echo "SIGN_KEY=$KEY_ID"
            echo "APPIMAGETOOL_SIGN_PASSPHRASE=$GPG_PASSPHRASE"
            echo "APPIMAGETOOL_FORCE_SIGN=1"
          } >> "$GITHUB_ENV"

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SIGNTOOL_PATH: ${{ steps.codesign.outputs.signtool }}
          AZURE_CLI_PATH: C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin\az.cmd
        with:
          projectPath: packages/app
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}${{ steps.codesign.outputs.args }}
          releaseId: ${{ needs.create-release.outputs.release-id }}
          # Written once by `finalize`, so the two platforms cannot overwrite each other.
          includeUpdaterJson: false

      - name: Upload GPG public key
        if: steps.gpg.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ needs.create-release.outputs.tag }}" "$RUNNER_TEMP/coh1stats-linux.asc" --clobber

  # latest.json (Windows + Linux updater targets) and SHA256SUMS over every
  # installer, then publish. Manual runs stay a draft.
  finalize:
    needs: [create-release, publish]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.create-release.outputs.tag }}
      VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # No pnpm on this job; v5 would auto-cache from package.json's packageManager.
          package-manager-cache: false

      - name: Write updater manifest and checksums
        run: |
          set -euo pipefail
          gh release download "$TAG" --dir "$RUNNER_TEMP/assets"
          node scripts/release-manifest.mjs --dir "$RUNNER_TEMP/assets" --out "$RUNNER_TEMP/out" \
            --tag "$TAG" --version "$VERSION"
          gh release upload "$TAG" "$RUNNER_TEMP/out/latest.json" "$RUNNER_TEMP/out/SHA256SUMS" --clobber

      - name: Publish release
        if: github.event_name != 'workflow_dispatch'
        run: gh release edit "$TAG" --draft=false --latest
