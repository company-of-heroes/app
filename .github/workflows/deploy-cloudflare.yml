name: Deploy Cloudflare

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        default: all
        options:
          - all
          - website
          - api-gateway
          - jobs-worker
          - smurf-worker

permissions:
  contents: read

# Never cancel a running deploy halfway; a newer push queues behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.targets.outputs.website }}
      workers: ${{ steps.targets.outputs.workers }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Deploys follow changesets: a target only ships when the Version Packages PR
      # bumped its version. The website bundles ui, api, i18n, game-data and
      # shared-assets, so a bump of any of those deploys it too.
      - name: Resolve deploy targets
        id: targets
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
              BEFORE=$(git rev-parse HEAD^)
            else
              git fetch --no-tags --depth=1 origin "$BEFORE"
            fi
          fi

          bumped() {
            local file="packages/$1/package.json"
            local old new
            old=$(git show "$BEFORE:$file" 2>/dev/null | jq -r '.version // empty' || true)
            new=$(jq -r '.version // empty' "$file")
            [ -n "$new" ] && [ "$old" != "$new" ]
          }
          wanted() {
            if [ "$EVENT" = "workflow_dispatch" ]; then
              [ "$TARGET" = "all" ] || [ "$TARGET" = "$1" ]
              return
            fi

            local package
            for package in "${@:2}"; do
              if bumped "$package"; then
                return 0
              fi
            done
            return 1
          }
          website=false
          if wanted website website ui api i18n game-data shared-assets; then
            website=true
          fi

          workers=""
          for worker in api-gateway jobs-worker smurf-worker; do
            if wanted "$worker" "$worker"; then
              workers="${workers:+$workers,}\"$worker\""
            fi
          done
          echo "website=$website" >> "$GITHUB_OUTPUT"
          echo "workers=[$workers]" >> "$GITHUB_OUTPUT"
          echo "website=$website workers=[$workers]"

  # api-gateway and jobs-worker bind to the website, so it deploys first.
  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website
        run: pnpm website:build

      - name: Deploy website
        working-directory: packages/website
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  workers:
    needs: [changes, website]
    # Run after the website, also when it was skipped (but not when it failed).
    if: >-
      !cancelled() && needs.changes.result == 'success' && needs.website.result != 'failure' &&
      needs.changes.outputs.workers != '[]'
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.changes.outputs.workers) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@company-of-heroes/${{ matrix.worker }}"

      - name: Deploy ${{ matrix.worker }}
        working-directory: packages/${{ matrix.worker }}
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
