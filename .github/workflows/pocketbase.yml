name: Build PocketBase

on:
  push:
    branches:
      - master
    # Only the Version Packages PR bumps this version, so builds follow changesets.
    paths:
      - 'packages/pocketbase/package.json'
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  REGISTRY: ghcr.io

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.check.outputs.bumped }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check version bump
        id: check
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          FILE=packages/pocketbase/package.json
          VERSION=$(jq -r '.version' "$FILE")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" != "push" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
            BEFORE=$(git rev-parse HEAD^)
          else
            git fetch --no-tags --depth=1 origin "$BEFORE"
          fi

          OLD=$(git show "$BEFORE:$FILE" 2>/dev/null | jq -r '.version // empty' || true)
          if [ "$OLD" != "$VERSION" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

          echo "pocketbase ${OLD:-none} -> $VERSION"

  build-pocketbase:
    needs: version
    if: needs.version.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/pocketbase
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.version.outputs.version }}
            type=sha

      - name: Build and push PocketBase Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: ./packages/pocketbase
          file: ./packages/pocketbase/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        continue-on-error: true
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/pocketbase
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
